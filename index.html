<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>차라투스트라의 일상 산책 - 유튜브 낭독 & 집필 스튜디오</title>
<style>
  :root {
    --bg: #f8f5ef;
    --surface: #ffffff;
    --text: #222222;
    --subtext: #666666;
    --accent: #7c5832;
    --accent-light: #efe7dc;
    --border: #e2dcd2;
  }
  body.dark {
    --bg: #141518;
    --surface: #1e2025;
    --text: #e8e6e1;
    --subtext: #9ca3af;
    --accent: #d4a373;
    --accent-light: #2b2723;
    --border: #2f333d;
  }
  body.prompter {
    --bg: #000000;
    --surface: #0a0a0a;
    --text: #ffffff;
    --subtext: #a3a3a3;
    --accent: #facc15;
    --accent-light: #262208;
    --border: #262626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.9;
    transition: background 0.25s, color 0.25s;
    padding-bottom: 120px;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .brand h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent);
  }
  .brand p {
    font-size: 0.8rem;
    color: var(--subtext);
  }
  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tab-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  body.prompter .tab-btn.active {
    color: #000;
  }
  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .action-btn {
    padding: 7px 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .action-btn:hover {
    background: var(--accent-light);
  }
  main {
    max-width: 820px;
    margin: 32px auto;
    padding: 0 24px;
  }
  .meta-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--accent-light);
    padding: 12px 18px;
    border-radius: 10px;
    margin-bottom: 28px;
    font-size: 0.9rem;
    color: var(--accent);
    font-weight: 600;
  }
  .script-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    font-size: 21px;
    line-height: 2.0;
    white-space: pre-wrap;
    word-break: keep-all;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
  }
  .script-container[contenteditable="true"] {
    outline: 2px solid var(--accent);
    background: var(--bg);
  }
  .prompter-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 16px;
    z-index: 200;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
  }
  .play-btn {
    padding: 9px 20px;
    border-radius: 24px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  body.prompter .play-btn { color: #000; }
  .timer {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 1rem;
    min-width: 64px;
    text-align: center;
  }
  body.focus-mode header { display: none; }
  .exit-focus {
    display: none;
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 300;
    padding: 8px 14px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  body.focus-mode .exit-focus { display: block; }
  @media (max-width: 640px) {
    .script-container { padding: 24px 20px; font-size: 18px; }
  }
</style>
</head>
<body>

<button class="exit-focus" onclick="toggleFocus()">집중모드 해제</button>

<header>
  <div class="brand">
    <h1>차라투스트라의 일상 산책</h1>
    <p>1회차: 서문 (1~10절) · 유튜브 낭독 & 집필 스튜디오</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('raw', this)">① 원문 낭독 (글만)</button>
    <button class="tab-btn" onclick="switchTab('broadcast', this)">② 방송용 대본 (30분)</button>
    <button class="tab-btn" onclick="switchTab('shorts', this)">③ 숏츠 대본 (1분)</button>
  </div>

  <div class="actions">
    <button class="action-btn" id="editBtn" onclick="toggleEdit()">✏️ 직접 수정</button>
    <button class="action-btn" onclick="resetScript()">↺ 초기화</button>
    <button class="action-btn" onclick="downloadTxt()">💾 .txt 저장</button>
  </div>
</header>

<main>
  <div class="meta-bar">
    <span id="trackTitle">트랙 ① 원문 낭독 (해설 없이 순수 본문 전체)</span>
    <span id="readTime">예상 낭독 시간: 약 25~30분</span>
  </div>
  <div id="scriptBox" class="script-container"></div>
</main>

<div class="prompter-bar">
  <button class="play-btn" id="scrollBtn" onclick="toggleScroll()">▶ 자동 스크롤 (Space)</button>
  <div class="control-group">
    <label>속도</label>
    <input type="range" id="speedRange" min="1" max="8" value="2">
    <span id="speedVal">2</span>
  </div>
  <div class="control-group">
    <span>⏱</span>
    <span class="timer" id="timerDisplay">00:00</span>
    <button class="action-btn" onclick="resetTimer()">리셋</button>
  </div>
  <div class="control-group">
    <button class="action-btn" onclick="changeFont(-2)">가-</button>
    <button class="action-btn" onclick="changeFont(2)">가+</button>
  </div>
  <div class="control-group">
    <button class="action-btn" onclick="setTheme('')">미색</button>
    <button class="action-btn" onclick="setTheme('dark')">심야</button>
    <button class="action-btn" onclick="setTheme('prompter')">프롬프터</button>
    <button class="action-btn" onclick="toggleFocus()">집중모드</button>
  </div>
</div>

<script>
const defaultScripts = {
  raw: `차라투스트라의 머리말

1.
차라투스트라는 서른 살이 되자 고향과 고향의 호수를 떠나 산으로 들어갔다. 그곳에서 그는 자신의 정신과 고독을 즐기며 십 년 동안이나 지치지 않고 머물렀다. 그러나 마침내 그의 마음에 변화가 찾아왔다. 어느 날 아침, 그는 동이 트기도 전에 일어나 태양을 마주 보고 서서 이렇게 말했다.

"위대한 별이여! 네가 비추어 줄 존재들이 없다면 너의 행복이 무엇이겠는가?
십 년 동안이나 너는 나의 동굴 위로 떠올랐다. 만약 나와 나의 독수리와 나의 뱀이 없었다면, 너는 너의 빛과 이 길에 지치고 말았을 것이다.
하지만 우리는 매일 아침 너를 기다렸고, 네게서 넘쳐흐르는 빛을 받아들이며 너를 축복했다.
보라! 나는 이제 나의 지혜에 지쳤다. 마치 꿀을 너무 많이 모은 꿀벌처럼, 내 지혜를 받아 줄 손들이 필요해졌다.
나는 나누어 주고 베풀고 싶다. 인간들 가운데 지혜로운 이들이 다시 한번 자신들의 어리석음을 기뻐하고, 가난한 이들이 다시 한번 자신들의 풍요로움을 기뻐할 때까지.
그러기 위해 나는 깊은 곳으로 내려가야 한다. 저녁 무렵 네가 바다 뒤로 가라앉아 저 아래 세상에도 빛을 가져다주는 것처럼 말이다. 넘쳐흐르는 별이여!
나 역시 너처럼 몰락해야 한다. 내가 내려가고자 하는 인간들이 부르는 말 그대로, 나는 아래로 내려가야 한다.
그러니 나를 축복해 다오, 고요한 눈동자여! 너무나 큰 행복마저도 질투 없이 바라볼 수 있는 그 맑은 눈으로.
넘쳐흐르려는 이 잔을 축복해 다오. 물이 황금빛으로 흘러넘쳐 너의 환희의 빛을 온 세상에 실어 나를 수 있도록.
보라! 이 잔은 다시 비워지기를 원하고, 차라투스트라는 다시 인간이 되기를 원한다."

이렇게 차라투스트라의 몰락이 시작되었다.

2.
차라투스트라는 혼자서 산을 내려왔고, 아무도 마주치지 않았다. 그러나 숲속으로 들어섰을 때, 갑자기 한 노인이 그의 앞에 나타났다. 노인은 뿌리를 캐기 위해 자신의 거룩한 오두막을 떠나 숲을 헤매고 있었다. 노인이 차라투스트라에게 말했다.

"이 나그네는 내게 낯설지 않구나. 몇 해 전 이곳을 지나갔었지. 그의 이름은 차라투스트라였다. 하지만 그때와는 모습이 변했구나.
그때 너는 너의 재를 산으로 짊어지고 올라갔었는데, 오늘은 너의 불꽃을 골짜기로 가져가려는 것이냐? 방화범에게 내려지는 벌이 두렵지 않느냐?
그래, 나는 차라투스트라를 알아본다. 그의 눈은 맑고, 입가에는 어떤 역겨움도 숨어 있지 않다. 춤추는 사람처럼 가볍게 걷고 있지 않은가?
차라투스트라는 변했다. 차라투스트라는 어린아이가 되었다. 차라투스트라는 이제 잠에서 깨어난 자가 되었다. 그런데 잠들어 있는 자들 틈에서 무엇을 하려는 것이냐?
너는 고독 속에서 마치 바다에 있는 것처럼 살았고, 바다가 너를 품어 주었다. 아아, 이제 뭍으로 올라오려 하는가? 아아, 다시 네 스스로 네 몸을 끌고 다니려 하는가?"

차라투스트라가 대답했다. "나는 인간들을 사랑합니다."

성자가 말했다. "내가 숲과 광야로 들어온 이유가 무엇이겠느냐? 내가 인간들을 너무나 사랑했기 때문이 아니겠느냐?
이제 나는 신을 사랑한다. 인간은 사랑하지 않는다. 내게 인간은 너무나 불완전한 존재다. 인간에 대한 사랑은 나를 파멸시킬 것이다."

차라투스트라가 대답했다. "내가 사랑을 말했습니까! 나는 인간들에게 선물을 가져다주려는 것입니다."

성자가 말했다. "그들에게 아무것도 주지 마라. 차라투스트라여, 차라투스트라가 그들의 짐을 덜어 주고 함께 짊어지는 편이 나을 것이다. 그것만으로도 그들에게는 가장 큰 기쁨이 될 테니.
どうしても 주고 싶다면, 동냥이나 조금 베풀어라. 그것도 그들이 스스로 구걸하게 만든 뒤에 주어라!"

"아닙니다. 저는 동냥을 베풀지 않습니다. 저는 그럴 만큼 가난하지 않습니다." 차라투스트라가 대답했다.

성자는 차라투스트라를 비웃으며 말했다. "그렇다면 그들이 너의 보물을 받아들이도록 잘해 보아라! 그들은 은둔자들을 믿지 않는다. 우리가 선물을 주러 왔다는 말을 믿지 않는 법이다.
거리를 걷는 우리의 발소리가 그들에게는 너무나 외롭게 들린다. 밤중에 침대에 누워 해가 뜨기 훨씬 전에 걸어가는 사람의 발소리를 들으면, 그들은 '저 도둑이 어디로 가는 걸까?' 하고 의심할 뿐이다.
인간들에게 가지 말고 숲에 머물러라! 차라투스트라여, 차라투스트라가 동물들에게 가는 편이 낫다! 어째서 너는 나처럼 되려 하지 않느냐? 곰들 틈의 곰이 되고, 새들 틈의 새가 되어라."

"그런데 성자께서는 숲속에서 무엇을 하고 계십니까?" 차라투스트라가 물었다.

성자가 대답했다. "나는 노래를 짓고 그 노래를 부른다. 노래를 지을 때면 웃고, 울고, 콧노래를 흥얼거린다. 그렇게 나는 신을 찬양한다.
노래하고, 울고, 웃고, 흥얼거리며 나는 나의 신인 그분을 찬양한다. 그런데 너는 우리에게 무슨 선물을 가져왔느냐?"

이 말을 들은 차라투스트라는 성자에게 인사를 건네며 말했다. "제가 당신께 드릴 것이 무엇이 있겠습니까! 제가 당신에게서 무언가를 빼앗지 않도록 어서 떠나겠습니다!"
그렇게 두 사람은 늙은이와 어린아이처럼 웃으며 헤어졌다.

그러나 차라투스트라는 혼자가 되자 마음속으로 이렇게 말했다.
"이런 일이 있을 수 있단 말인가! 이 늙은 성자는 숲속에 살면서 아직 아무런 소식도 듣지 못했구나. 신이 죽었다는 사실을 말이다!"

3.
차라투스트라는 숲과 가장 가까운 도시에 도착했을 때, 시장터에 수많은 군중이 모여 있는 것을 보았다. 줄타기 광대의 공연이 열린다는 소문이 퍼져 있었기 때문이다. 차라투스트라는 군중을 향해 이렇게 외쳤다.

"나는 그대들에게 위버멘쉬(초인)를 가르치노라. 인간은 극복되어야 할 그 무엇이다. 그대들은 인간을 극복하기 위해 무엇을 했는가?
지금까지 모든 존재는 자기 자신을 넘어서는 무언가를 창조해 왔다. 그런데 그대들은 이 거대한 밀물의 썰물이 되려 하는가? 인간을 극복하기보다는 차라리 짐승으로 되돌아가려 하는가?
인간에게 원숭이란 무엇인가? 웃음거리이거나 고통스러운 수치심일 뿐이다. 위버멘쉬에게 인간 역시 바로 그러한 존재가 될 것이다. 웃음거리이거나 고통스러운 수치심 말이다.
그대들은 벌레에서 인간으로 가는 길을 걸어왔지만, 그대들 안에는 여전히 벌레의 모습이 많이 남아 있다. 한때 그대들은 원숭이였고, 지금도 인간은 어떤 원숭이보다 더 원숭이답다.
그대들 가운데 가장 지혜로운 자조차도 식물과 유령이 뒤섞인 불협화음일 뿐이다. 그러나 내가 그대들에게 유령이나 식물이 되라고 말했는가?
보라, 나는 그대들에게 위버멘쉬를 가르치노라!
위버멘쉬는 대지의 뜻이다. 그대들의 의지가 말하게 하라. 위버멘쉬가 대지의 뜻이 되기를!
형제들이여, 간곡히 부탁하노니 대지에 충실하라. 그리고 그대들에게 저세상의 희망을 말하는 자들을 믿지 마라! 그들은 알든 모르든 독을 타는 자들이다.
그들은 삶을 경멸하는 자들이며, 스스로 시들어 가고 독에 중독된 자들이다. 대지가 그들에게 지쳤으니, 그들은 어서 사라져 버리는 것이 좋다!
한때 신에 대한 모독이 가장 큰 죄악이었으나, 신이 죽자 그 모독자들도 함께 죽었다. 이제 가장 무서운 죄는 대지를 모독하는 것이며, 알 수 없는 신의 내장을 대지의 뜻보다 더 높이 받드는 것이다!
한때 영혼은 육체를 경멸하며 바라보았고, 그 경멸이 가장 숭고한 것으로 여겨졌다. 영혼은 육체가 야위고 흉측하며 굶주리기를 바랐다. 그렇게 육체와 대지로부터 도망치려 했던 것이다.
오, 그 영혼 자신이야말로 야위고 흉측하며 굶주려 있었다. 잔인함이 그 영혼의 쾌락이었다!
그러나 형제들이여, 그대들도 내게 말해 보라. 그대들의 영혼에 대해 그대들의 육체는 무엇이라 말하는가? 그대들의 영혼은 빈곤함과 더러움과 가련한 안일함 그 자체가 아닌가?
진실로 인간은 더러운 강물이다. 더러운 강물을 받아들이면서도 스스로 더러워지지 않으려면, 사람은 먼저 바다가 되어야 한다.
보라, 나는 그대들에게 위버멘쉬를 가르치노라. 그야말로 이 바다이며, 그대들의 커다란 경멸이 가라앉을 수 있는 곳이다.
그대들이 체험할 수 있는 가장 위대한 것은 무엇인가? 그것은 커다란 경멸의 시간이다. 그대들의 행복마저 역겨워지고, 이성과 덕마저 역겨워지는 시간 말이다.
'나의 행복이 무엇이란 말인가! 그것은 빈곤함과 더러움과 가련한 안일함일 뿐이다. 나의 행복은 존재 자체를 정당화해야 마땅하다!'라고 말하는 시간.
'나의 이성이 무엇이란 말인가! 사자가 먹이를 갈망하듯 지식을 갈망하는가? 그것은 빈곤함과 더러움과 가련한 안일함일 뿐이다!'라고 말하는 시간.
'나의 덕이 무엇이란 말인가! 아직 나를 광기로 몰아넣지도 못했구나. 나는 나의 선과 악에 얼마나 지쳐 있는가! 이 모든 것이 빈곤함과 더러움과 가련한 안일함일 뿐이다!'라고 말하는 시간.
'나의 정의가 무엇이란 말인가! 내가 불꽃이 되고 숯불이 된 것을 보지 못했다. 그러나 정의로운 자는 불꽃이고 숯불이다!'라고 말하는 시간.
'나의 연민이 무엇이란 말인가! 연민이란 인간을 사랑하는 자가 못 박히는 십자가가 아닌가? 그러나 나의 연민은 십자가에 못 박히는 것이 아니다.'라고 말하는 시간.
그대들은 이미 그렇게 말해 본 적이 있는가? 그렇게 외쳐 본 적이 있는가? 아, 내가 그대들이 그렇게 외치는 소리를 들을 수만 있다면!
그대들의 죄악이 아니라 그대들의 적당함이 하늘을 향해 외치고 있다. 그대들의 죄악 속의 인색함마저 하늘을 향해 외치고 있다!
그대들을 혀로 핥아 삼킬 번개는 어디에 있는가? 그대들에게 접종되어야 할 광기는 어디에 있는가?
보라, 나는 그대들에게 위버멘쉬를 가르치노라. 그야말로 이 번개이며, 이 광기이다!"

차라투스트라가 이렇게 말했을 때, 군중 속에서 한 사람이 외쳤다. "줄타기 광대 이야기는 이제 충분히 들었소. 이제 실제 모습을 보여 주시오!" 그러자 모든 군중이 차라투스트라를 비웃었다. 특히 줄타기 광대는 그 말이 자신을 부르는 것이라 여기고 공연을 시작했다.

4.
그러나 차라투스트라는 군중을 바라보며 놀라워했다. 그리고 이렇게 말했다.

"인간은 짐승과 위버멘쉬 사이에 놓인 하나의 밧줄이다. 심연 위에 걸린 밧줄이다.
건너가는 것도 위험하고, 길 위에 머무는 것도 위험하며, 뒤돌아보는 것도 위험하고, 떨며 멈춰 서는 것도 위험하다.
인간에게 위대한 점이 있다면, 그것은 그가 목적이 아니라 하나의 다리라는 사실이다. 인간에게 사랑받을 만한 점이 있다면, 그것은 그가 건너가는 존재이자 몰락하는 존재라는 사실이다.
나는 위대한 경멸을 하는 자들을 사랑한다. 그들은 위대한 경외를 하는 자들이며, 저편 기슭을 향해 날아가는 동경의 화살이기 때문이다.
나는 대지를 희생시키고 위버멘쉬에게 대지가 속하게 하려고 별들 너머에서 근거를 찾지 않는 자들을 사랑한다. 그들은 스스로를 대지에 바쳐, 언젠가 대지가 위버멘쉬의 것이 되게 하려는 자들이다.
나는 알기 위해 사는 자들을 사랑한다. 언젠가 위버멘쉬가 살 수 있도록 알기를 원하는 자들을 사랑한다. 그리하여 그들은 자신의 몰락을 원한다.
나는 위버멘쉬에게 집을 지어 주고, 그를 위해 대지와 짐승과 식물을 준비하려고 일하고 발명하는 자들을 사랑한다. 그리하여 그들은 자신의 몰락을 원한다.
나는 자신의 덕을 사랑하는 자들을 사랑한다. 덕이란 몰락을 향한 의지이며 동경의 화살이기 때문이다.
나는 자신의 영혼을 위해 한 방울의 정신도 남겨 두지 않고, 온전히 자신의 덕의 정신이 되고자 하는 자들을 사랑한다. 그리하여 그들은 정신으로서 다리를 건너간다.
나는 자신의 덕을 자신의 경향이자 운명으로 만드는 자들을 사랑한다. 그리하여 그들은 자신의 덕을 위해 살고, 더 이상 살지 않기를 원한다.
나는 너무 많은 덕을 가지려 하지 않는 자들을 사랑한다. 하나의 덕이 두 개의 덕보다 더 큰 덕이다. 거기에 운명이 걸리는 매듭이 더 단단히 묶이기 때문이다.
나는 영혼이 넘쳐흘러 자기 자신을 잊고, 모든 사물을 자기 안에 품는 자들을 사랑한다. 그리하여 모든 사물이 그들의 몰락이 된다.
나는 자유로운 정신과 자유로운 마음을 가진 자들을 사랑한다. 그들의 머리는 단지 그들의 마음의 내장일 뿐이지만, 그들의 마음은 그들을 몰락으로 이끈다.
나는 인간들 위에 드리운 먹구름에서 한 방울씩 떨어지는 무거운 빗방울 같은 자들을 사랑한다. 그들은 번개가 다가오고 있음을 알리고, 예고자로서 사라져 간다.
보라, 나는 번개의 예고자이며 먹구름에서 떨어지는 무거운 빗방울이다. 그러나 그 번개의 이름은 바로 위버멘쉬다."

5.
차라투스트라가 이 말을 마쳤을 때, 그는 다시 군중을 바라보며 침묵했다. "저들이 서서 웃고 있구나. 그들은 나를 이해하지 못한다. 나는 저 귀에 맞는 입이 아니다."
그는 마음속으로 생각했다. "먼저 저들의 귀를 부수어 눈으로 듣는 법을 배우게 해야 하는가? 북소리처럼, 참회를 외치는 설교자처럼 천둥을 쳐야 하는가? 아니면 저들은 말더듬이들의 말만 믿는 것일까?
저들에게는 자랑스러워하는 무언가가 있다. 저들이 자랑스러워하는 그것을 무엇이라 부르는가? 저들은 그것을 '교양'이라 부르며, 그것이 자신들을 염소치기와 구별해 준다고 여긴다.
그래서 저들은 자신들을 향해 '경멸'이라는 말을 쓰는 것을 듣기 싫어한다. 그러니 나는 저들의 자존심에 대고 말하리라.
나는 저들에게 가장 경멸받을 만한 존재에 대해 말하리라. 그것이 바로 '마지막 인간'이다."

그리고 차라투스트라는 군중에게 이렇게 말했다.

"인간이 스스로의 목표를 세워야 할 때가 왔다. 인간이 자신의 가장 높은 희망의 씨앗을 심어야 할 때가 왔다.
아직 그 토양은 충분히 비옥하다. 그러나 언젠가 이 토양은 메마르고 척박해져, 더 이상 그곳에서 어떤 큰 나무도 자라나지 못할 것이다.
불행하여라! 인간이 더 이상 자신의 동경의 화살을 인간 너머로 쏘아 올리지 못하고, 활시위마저 팽팽히 당기는 법을 잊어버릴 때가 다가오고 있다!
나는 그대들에게 말한다. 춤추는 별을 잉태하려면 반드시 자기 안에 혼돈을 지니고 있어야 한다. 나는 그대들에게 말한다. 그대들 안에는 아직 혼돈이 있다.
불행하여라! 인간이 더 이상 어떤 별도 낳지 못할 때가 다가오고 있다. 불행하여라! 자기 자신마저 경멸할 줄 모르는 가장 경멸스러운 인간의 시대가 다가오고 있다!
보라! 나는 그대들에게 '마지막 인간'을 보여 주노라.

'사랑이 무엇인가? 창조가 무엇인가? 동경이 무엇인가? 별이 무엇인가?' 이렇게 마지막 인간은 물으며 눈을 깜빡인다.
그때 대지는 작아졌고, 그 위에서 모든 것을 작게 만드는 마지막 인간이 깡총거리며 뛰어다닌다. 그의 족속은 벼룩처럼 박멸할 수가 없다. 마지막 인간이 가장 오래 산다.
'우리는 행복을 발명해 냈다.' 마지막 인간들은 말하며 눈을 깜빡인다.

그들은 살기 힘든 고장들을 떠났다. 따뜻함이 필요하기 때문이다. 사람들은 여전히 이웃을 사랑하고 이웃에게 몸을 비빈다. 따뜻함이 필요하기 때문이다.
병드는 것과 의심하는 것을 그들은 죄악으로 여긴다. 사람들은 조심조심 걷는다. 여전히 돌부리나 인간에게 걸려 넘어지는 자는 바보일 뿐이다!
가끔씩 약간의 독을 마신다. 그것은 기분 좋은 꿈을 꾸게 해 주니까. 그리고 마지막에는 많은 독을 마신다. 기분 좋게 죽기 위해서.
사람들은 여전히 일을 한다. 일은 좋은 심심풀이니까. 그러나 그들은 그 심심풀이가 몸을 상하게 하지 않도록 조심한다.
사람들은 더 이상 가난해지지도 않고 부유해지지도 않는다. 둘 다 너무 번거로운 일이기 때문이다. 누가 여전히 지배하려 하겠는가? 누가 여전히 복종하려 하겠는가? 둘 다 너무 번거로운 일이다.
목자는 없고 오직 한 무리의 양 떼만 있을 뿐이다! 모두가 똑같은 것을 원하고, 모두가 평등하다. 다르게 느끼는 자는 제 발로 정신병원에 들어간다.
'예전에는 온 세상이 미쳐 있었지.' 가장 영리한 자들이 말하며 눈을 깜빡인다.

사람들은 영리하며, 그동안 일어났던 모든 일을 다 안다. 그래서 비웃음이 끝이 없다. 사람들은 여전히 다투지만 곧 화해한다. 그렇지 않으면 위장이 상하니까.
사람들은 낮을 위한 작은 쾌락을 가지고 있고, 밤을 위한 작은 쾌락도 가지고 있다. 하지만 건강을 가장 소중히 여긴다.
'우리는 행복을 발명해 냈다.' 마지막 인간들은 말하며 눈을 깜빡인다."

차라투스트라의 첫 번째 연설은 여기서 끝났다. 군중의 함성과 환호가 그를 가로막았기 때문이다. "차라투스트라여, 우리에게 그 마지막 인간을 주시오! 우리를 그 마지막 인간으로 만들어 주시오! 그러면 위버멘쉬는 당신이 가지시오!" 모든 군중이 환호하며 혀를 찼다.
그러나 차라투스트라는 슬퍼하며 마음속으로 말했다. "그들은 나를 이해하지 못한다. 나는 저 귀에 맞는 입이 아니다.
아마도 내가 산속에서 너무 오래 살았나 보다. 시냇물과 나무들의 소리에 너무 오래 귀를 기울였나 보다. 이제 나는 그들에게 마치 염소치기처럼 말하고 있구나.
나의 영혼은 흔들림 없이 맑다. 정오 이전의 산처럼. 그러나 그들은 내가 차갑다고 생각하고, 끔찍한 농담을 하는 조롱꾼이라고 생각한다.
이제 그들은 나를 바라보며 웃고 있다. 그리고 웃으면서 나를 미워하고 있다. 그들의 웃음 속에는 얼음이 서려 있다."

6.
그때 군중이 침묵하게 만드는 사건이 벌어졌다. 줄타기 광대가 공연을 시작했던 것이다. 그는 작은 문을 나와 두 탑 사이에 매달린 밧줄 위를 걷고 있었다. 밧줄은 시장터와 군중 바로 위에 걸려 있었다.
그가 밧줄의 한가운데쯤 이르렀을 때, 작은 문이 다시 열리더니 어릿광대처럼 알록달록한 옷을 입은 사내가 뛰어 나왔다. 그는 빠른 걸음으로 앞선 광대를 뒤쫓았다.
"어서 가라, 절름발이! 게으름뱅이, 밀수꾼, 창백한 얼굴아! 내 발뒤꿈치로 너를 간지럽히기 전에 어서 가라! 네가 두 탑 사이에서 뭘 하고 있느냐? 너는 탑 안에 갇혀 있어야 할 놈이다. 너보다 나은 사람의 길을 막고 있구나!"
그러면서 그는 한 걸음씩 더 가까이 다가왔다. 그리고 광대 바로 뒤에 이르렀을 때, 악마 같은 소리를 지르며 앞선 광대의 머리 위로 훌쩍 뛰어넘었다.
자신의 경쟁자가 승리하는 것을 본 광대는 정신을 잃고 중심을 놓쳤다. 그는 장대를 내던지고 자신보다 더 빠르게 팔다리의 소용돌이가 되어 깊은 곳으로 추락했다.
시장터와 군중은 폭풍이 몰아치는 바다처럼 술렁이며 서로 뒤엉켜 도망쳤다. 특히 광대의 몸이 떨어질 자리에 있던 사람들이 그러했다.

그러나 차라투스트라는 움직이지 않고 그 자리에 서 있었고, 광대의 몸은 바로 그의 곁에 떨어졌다. 온몸이 부서지고 망가졌지만, 아직 숨은 붙어 있었다. 잠시 후 부서진 광대가 의식을 되찾고 곁에 무릎 꿇고 있는 차라투스트라를 보았다.
"여기서 뭘 하고 계십니까?" 광대가 마침내 말했다. "악마가 내 발을 걸어 넘어뜨릴 줄 오래전부터 알고 있었소. 이제 악마가 나를 지옥으로 끌고 갈 것이오. 당신이 막아 주시겠소?"

"친구여, 맹세코 말하건대 네가 말하는 그런 것은 존재하지 않는다. 악마도 지옥도 없다. 네 영혼은 네 육체보다 더 빨리 죽을 것이다. 그러니 이제 아무것도 두려워하지 마라!" 차라투스트라가 대답했다.

광대는 의심스러운 눈으로 그를 올려다보았다. "당신 말이 사실이라면, 내가 목숨을 잃더라도 잃는 것이 아무것도 없겠군요. 나는 매질과 배고픔으로 춤을 배운 짐승과 다를 바가 없었소."

"그렇지 않다." 차라투스트라가 말했다. "너는 위험을 네 직업으로 삼았다. 거기에는 경멸받을 만한 것이 아무것도 없다. 이제 너는 네 직업 때문에 목숨을 잃는다. 그러니 내가 내 손으로 너를 묻어 주겠다."

차라투스트라가 이 말을 마치자, 죽어 가는 광대는 더 이상 대답하지 않았다. 다만 고맙다는 표시를 하려는 듯 자신의 손을 움직여 차라투스트라의 손을 찾았다.

7.
그러는 사이 저녁이 찾아왔고, 시장터는 어둠 속에 잠겼다. 군중은 흩어졌다. 호기심과 공포마저 지쳐 버렸기 때문이다. 차라투스트라는 땅바닥에 앉아 죽은 광대 곁을 지켰고, 깊은 생각에 잠겨 시간 가는 줄 몰랐다. 마침내 밤이 찾아왔고, 차가운 바람이 고독한 자의 몸을 스쳤다. 그때 차라투스트라는 일어서서 마음속으로 말했다.

"진실로 오늘 차라투스트라는 멋진 고기잡이를 했구나! 인간은 한 명도 낚지 못했지만, 시체 한 구를 낚았으니 말이다.
인간의 존재는 섬뜩하고 여전히 아무런 의미가 없다. 한 어릿광대가 인간의 운명이 될 수 있다니.
나는 인간들에게 그들의 존재의 의미를 가르치고 싶다. 그것은 바로 위버멘쉬, 인간이라는 먹구름에서 내리치는 번개다.
하지만 나는 아직 그들에게서 너무 멀리 떨어져 있고, 나의 뜻은 그들의 뜻에 닿지 못한다. 인간들에게 나는 아직 바보와 시체 사이의 중간 존재일 뿐이다.
밤은 어둡고, 차라투스트라의 길 또한 어둡다. 오라, 차갑고 뻣뻣한 길동무여! 내가 너를 내 손으로 묻어 줄 곳으로 데려가마."

8.
차라투스트라는 마음속으로 이렇게 말한 뒤 시체를 등에 업고 길을 나섰다. 백 걸음도 채 걷지 않았을 때, 한 사내가 그에게 슬그머니 다가와 귓속말을 했다. 보라! 말을 건넨 자는 탑에서 나왔던 그 어릿광대였다.

"이 도시를 떠나시오, 차라투스트라여! 이곳에는 당신을 미워하는 자들이 너무 많소. 선량하고 의로운 자들이 당신을 미워하며 당신을 자신들의 적이자 경멸자라고 부르고 있소. 정통 신앙을 믿는 자들도 당신을 미워하며 당신을 대중의 위험인물이라고 부르고 있소.
사람들이 당신을 비웃었던 것이 그나마 다행이었소. 당신은 정말 광대처럼 말했기 때문이오. 죽은 개와 어울렸던 것도 다행이었소. 그렇게 스스로를 낮춤으로써 오늘 당신은 목숨을 건진 것이오.
하지만 이 도시를 떠나시오. 그렇지 않으면 내일 내가 당신의 머리 위로 뛰어넘을 것이오. 산 자가 죽은 자를 뛰어넘듯이 말이오."
이 말을 남기고 사내는 사라졌다. 차라투스트라는 어두운 거리를 계속 걸어갔다.

도시의 성문 앞에서 그는 무덤 파는 인부들을 만났다. 그들은 횃불로 차라투스트라의 얼굴을 비추어 보고는 그를 알아보고 크게 비웃었다.
"차라투스트라가 죽은 개를 짊어지고 가는구나! 차라투스트라가 무덤 파는 인부가 되었다니 기특하군! 우리 손은 이 구운 고기를 만지기엔 너무 깨끗하거든. 차라투스트라가 악마에게서 먹이를 훔치려는 모양이군! 그래, 맛있게 드시게! 악마가 차라투스트라보다 더 훌륭한 도둑이 아니라면 말이지! 악마가 둘 다 훔쳐 먹어 버릴지도 모르니까!"
그들은 서로 머리를 맞대고 낄낄거리며 웃었다.

차라투스트라는 한마디도 대꾸하지 않고 자기 길을 걸어갔다. 숲과 늪을 지나 두 시간쯤 걸었을 때, 그는 늑대들의 굶주린 울음소리를 너무 많이 들은 탓에 스스로도 배고픔을 느꼈다. 그래서 불빛이 새어 나오는 외딴집 앞에 멈춰 섰다.

"배고픔이 도둑처럼 나를 덮치는구나." 차라투스트라가 말했다. "숲과 늪 속에서, 그리고 깊은 밤중에 나의 배고픔이 나를 덮치는구나.
나의 배고픔은 참으로 이상한 변덕을 부린다. 식사를 마친 뒤에야 찾아오는 경우가 많으니 말이다. 오늘 하루 종일 굶었는데, 대체 어디에 숨어 있었단 말인가?"

그러면서 차라투스트라는 집 문을 두드렸다. 등불을 든 노인이 문을 열고 물었다. "누가 나와 나의 나쁜 잠을 찾아왔는가?"

"산 자와 죽은 자입니다." 차라투스트라가 대답했다. "먹을 것과 마실 것을 조금 주십시오. 낮 동안 그것들을 잊고 지냈습니다. 배고픈 자를 먹이는 자는 자기 자신의 영혼을 살찌우는 법입니다. 지혜가 그렇게 말합니다."

노인은 들어갔다가 곧 빵과 포도주를 들고 나와 차라투스트라에게 건넸다.
"이곳은 배고픈 자들에게는 고약한 고장이오. 그래서 내가 여기에 살고 있는 것이오. 짐승과 인간이 은둔자인 나를 찾아오지. 하지만 그대의 길동무에게도 먹고 마시라고 하시오. 그대보다 훨씬 더 지쳐 보이니 말이오."

차라투스트라가 대답했다. "제 길동무는 죽었습니다. 그에게 먹고 마시게 하기는 어려울 것입니다."

"그건 내 알 바 아니오." 노인이 퉁명스럽게 말했다. "내 집 문을 두드리는 자는 내가 주는 것을 받아야 하오. 드시오, 그리고 잘 가시오!"

그 후 차라투스트라는 별빛만을 길잡이 삼아 두 시간을 더 걸었다. 그는 밤길을 걷는 데 익숙했고, 잠든 모든 것들의 얼굴을 들여다보기를 좋아했기 때문이다. 동이 터 오를 무렵, 차라투스트라는 깊은 숲속에 이르렀고 더 이상 길이 보이지 않았다. 그때 그는 속이 텅 빈 나무를 발견하고 그 안에 시체를 눕혔다. 늑대들로부터 시체를 보호하기 위해서였다.
그리고 차라투스트라 자신은 바닥의 이끼 위에 누웠다. 곧 그는 잠에 빠져들었다. 육체는 지쳤지만 영혼은 흔들림 없이 고요했다.

9.
차라투스트라는 오랫동안 잠을 잤다. 새벽빛뿐만 아니라 아침 햇살까지 그의 얼굴 위를 지나갔다. 마침내 그의 눈이 떠졌다. 차라투스트라는 놀란 눈으로 숲과 침묵을 바라보았고, 놀란 눈으로 자신의 내면을 들여다보았다. 그리고 폭풍우가 몰아치는 것을 본 선원처럼 재빨리 몸을 일으키며 환호성을 질렀다.

"내게 빛이 떠올랐다! 내게는 길동무가 필요하다. 산 길동무가 필요하다. 내가 원하는 곳으로 내가 짊어지고 가야 하는 죽은 길동무나 시체가 아니라 말이다.
내게는 산 길동무가 필요하다. 스스로를 따르기를 원하기 때문에 나를 따르는 자들, 그리고 내가 가고자 하는 곳으로 함께 가려는 자들이 필요하다.
내게 빛이 떠올랐다! 차라투스트라는 군중에게 말할 것이 아니라 길동무들에게 말해야 한다! 차라투스트라는 양 떼의 목자나 개가 되어서는 안 된다!
많은 이들을 무리에서 떼어 내기 위해 나는 왔다. 군중과 양 떼는 나에게 화를 낼 것이다. 차라투스트라는 목자들에게 도둑이라 불릴 것이다.
나는 그들을 목자라 부르지만, 그들은 스스로를 선량하고 의로운 자들이라 부른다. 나는 그들을 목자라 부르지만, 그들은 스스로를 정통 신앙의 신자들이라 부른다.
저 선량하고 의로운 자들을 보라! 그들이 가장 미워하는 자가 누구인가? 그들의 가치의 석판을 부수는 자, 파괴자, 범죄자다. 그러나 바로 그자가 창조하는 자이다!
모든 신앙의 신자들을 보라! 그들이 가장 미워하는 자가 누구인가? 그들의 가치의 석판을 부수는 자, 파괴자, 범죄자다. 그러나 바로 그자가 창조하는 자이다!
차라투스트라는 길동무를 찾는다. 시체가 아니라 산 길동무를, 양 떼나 신자가 아니라 살아 있는 동반자를 찾는다.
차라투스트라는 함께 창조하는 자들을 찾는다. 새로운 석판 위에 새로운 가치를 새겨 넣는 자들을 찾는다.
차라투스트라는 함께 수확하는 자들을 찾는다. 모든 것이 수확할 만큼 무르익었기 때문이다! 그러나 그에게는 백 개의 낫이 부족하다. 그래서 그는 이삭을 뜯어내며 초조해한다.
차라투스트라는 함께 창조하는 자들을 찾고, 함께 수확하는 자들과 함께 기뻐하는 자들을 찾는다. 그가 양 떼와 목자들과 시체들과 무슨 상관이 있겠는가!
그리고 너, 나의 첫 번째 길동무여, 평안히 잠들어라! 나는 너를 속이 빈 나무 안에 잘 묻어 주었고, 늑대들로부터 잘 숨겨 주었다.
이제 나는 너와 헤어진다. 시간이 다 되었다. 두 번의 새벽 사이에 새로운 진리가 내게 찾아왔다.
나는 목자도, 무덤 파는 인부도 되어서는 안 된다. 나는 다시는 군중에게 말하지 않으리라. 이것이 내가 죽은 자에게 건네는 마지막 말이다.
나는 창조하는 자들, 수확하는 자들, 기뻐하는 자들과 함께하리라. 그들에게 무지개를 보여 주고, 위버멘쉬로 향하는 모든 계단을 보여 주리라.
나는 홀로 사는 은둔자들과 둘이서 사는 은둔자들에게 나의 노래를 부르리라. 아직 듣지 못한 것들을 들을 귀를 가진 자들의 가슴을 나의 행복으로 무겁게 채워 주리라.
나는 나의 목표를 향해 나아간다. 나의 길을 간다. 주저하고 게으른 자들을 뛰어넘어 갈 것이다. 나의 걸음이 그들의 몰락이 되게 하리라!"

10.
차라투스트라가 마음속으로 이 말을 마쳤을 때, 태양은 정오에 이르러 있었다. 그때 그는 날카로운 새 울음소리를 듣고 의아한 눈으로 하늘을 올려다보았다. 보라! 한 마리의 독수리가 커다란 원을 그리며 허공을 날고 있었고, 그 독수리에게 한 마리의 뱀이 매달려 있었다. 먹잇감처럼 매달린 것이 아니라 친구처럼 독수리의 목을 휘감고 있었다.

"나의 동물들이구나!" 차라투스트라가 기뻐하며 말했다.
"태양 아래 가장 자랑스러운 동물과 태양 아래 가장 지혜로운 동물이 정찰을 나섰구나.
차라투스트라가 아직 살아 있는지 알아보려고 나왔구나. 진실로 나는 아직 살아 있는가?
나는 짐승들 틈에 있을 때보다 인간들 틈에 있을 때 더 큰 위험을 겪었다. 차라투스트라는 위험한 길을 걷고 있구나. 나의 동물들이 나를 인도해 주기를!"

차라투스트라는 이 말을 하고 숲속에서 만났던 성자의 말을 떠올리며 한숨을 내쉬고 마음속으로 이렇게 말했다.
"아, 내가 더 지혜로워질 수 있다면! 나의 뱀처럼 근본부터 지혜로워질 수 있다면!

let currentTab = 'raw';
let isEditing = false;
let scrollInterval = null;
let timerInterval = null;
let seconds = 0;
let fontSize = 21;

const trackMeta = {
  raw: {
    title: '트랙 ① 원문 낭독 (해설 없이 순수 본문 전체)',
    time: '예상 낭독 시간: 약 25~30분'
  },
  broadcast: {
    title: '트랙 ② 방송용 대본 (일상 풀이 + 공감 한 줄 + 시그니처 엔딩)',
    time: '예상 낭독 시간: 약 30분 (여유 호흡 기준)'
  },
  shorts: {
    title: '트랙 ③ 숏츠 대본 (핵심 요약 + 시그니처 엔딩)',
    time: '예상 낭독 시간: 약 50초~1분'
  }
};

function loadContent() {
  const saved = localStorage.getItem('zarathustra_ep1_' + currentTab);
  document.getElementById('scriptBox').innerText = saved ? saved : defaultScripts[currentTab];
  document.getElementById('trackTitle').innerText = trackMeta[currentTab].title;
  document.getElementById('readTime').innerText = trackMeta[currentTab].time;
}

function switchTab(tab, btn) {
  if (isEditing) toggleEdit();
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  loadContent();
}

function toggleEdit() {
  const box = document.getElementById('scriptBox');
  const btn = document.getElementById('editBtn');
  isEditing = !isEditing;
  box.contentEditable = isEditing;
  if (isEditing) {
    if (scrollInterval) toggleScroll();
    btn.innerText = '✅ 수정 완료';
    box.focus();
  } else {
    localStorage.setItem('zarathustra_ep1_' + currentTab, box.innerText);
    btn.innerText = '✏️ 직접 수정';
  }
}

function resetScript() {
  if (confirm('현재 탭의 수정 내용을 초기 원고로 되돌릴까요?')) {
    localStorage.removeItem('zarathustra_ep1_' + currentTab);
    loadContent();
  }
}

function downloadTxt() {
  const text = document.getElementById('scriptBox').innerText;
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `차라투스트라_1회차_${currentTab}.txt`;
  a.click();
}

function toggleScroll() {
  const btn = document.getElementById('scrollBtn');
  if (scrollInterval) {
    clearInterval(scrollInterval);
    scrollInterval = null;
    clearInterval(timerInterval);
    timerInterval = null;
    btn.innerText = '▶ 자동 스크롤 (Space)';
  } else {
    if (isEditing) toggleEdit();
    btn.innerText = '⏸ 일시정지 (Space)';
    scrollInterval = setInterval(() => {
      const speed = Number(document.getElementById('speedRange').value);
      window.scrollBy(0, speed * 0.45);
    }, 30);
    timerInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    }, 1000);
  }
}

function resetTimer() {
  seconds = 0;
  document.getElementById('timerDisplay').innerText = '00:00';
}

document.getElementById('speedRange').addEventListener('input', (e) => {
  document.getElementById('speedVal').innerText = e.target.value;
});

function changeFont(delta) {
  fontSize = Math.max(14, Math.min(36, fontSize + delta));
  document.getElementById('scriptBox').style.fontSize = fontSize + 'px';
}

function setTheme(theme) {
  document.body.classList.remove('dark', 'prompter');
  if (theme) document.body.classList.add(theme);
}

function toggleFocus() {
  document.body.classList.toggle('focus-mode');
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !isEditing && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    toggleScroll();
  }
});

loadContent();
</script>
