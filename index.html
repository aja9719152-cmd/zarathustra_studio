<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>차라투스트라의 일상 산책 - 유튜브 낭독 & 집필 스튜디오 (제1부 완결판)</title>
<style>
  :root {
    --bg: #f8f5ef;
    --surface: #ffffff;
    --text: #222222;
    --subtext: #666666;
    --accent: #7c5832;
    --accent-light: #efe7dc;
    --border: #e2dcd2;
  }
  body.dark {
    --bg: #141518;
    --surface: #1e2025;
    --text: #e8e6e1;
    --subtext: #9ca3af;
    --accent: #d4a373;
    --accent-light: #2b2723;
    --border: #2f333d;
  }
  body.prompter {
    --bg: #000000;
    --surface: #0a0a0a;
    --text: #ffffff;
    --subtext: #a3a3a3;
    --accent: #facc15;
    --accent-light: #262208;
    --border: #262626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100dvh;
    overflow: hidden;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.25s, color 0.25s;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header {
    flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 28px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .brand-area {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand h1 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
  }
  .ep-select {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--accent);
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.86rem;
    cursor: pointer;
  }
  .tabs {
    display: flex;
    gap: 6px;
  }
  .tab-btn {
    padding: 6px 14px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  body.prompter .tab-btn.active {
    color: #000;
  }
  .actions {
    display: flex;
    gap: 6px;
  }
  .action-btn {
    padding: 6px 11px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.82rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .action-btn:hover, .action-btn.active-mode {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  /* 데스크톱 웹: 좌우 2단 펼쳐보기 레이아웃으로 가로 폭을 넓게 활용 */
  main {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 1520px;
    margin: 0 auto;
    padding: 12px 28px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .meta-bar {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--accent-light);
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 0.84rem;
    color: var(--accent);
    font-weight: 600;
  }
  .book-spread {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .book-spread.single-col {
    grid-template-columns: 1fr;
  }
  .script-page {
    min-height: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 32px;
    font-size: 20px;
    line-height: 1.88;
    white-space: pre-wrap;
    word-break: keep-all;
    overflow-wrap: break-word;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
  }
  .script-page[contenteditable="true"] {
    outline: 2px solid var(--accent);
    background: var(--bg);
    overflow-y: auto;
  }
  .bottom-bar {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 28px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .nav-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .page-btn {
    padding: 9px 20px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
  }
  body.prompter .page-btn { color: #000; }
  .page-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .page-indicator {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text);
    min-width: 96px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .tool-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .timer {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 0.88rem;
    min-width: 48px;
    text-align: center;
  }
  body.focus-mode header,
  body.focus-mode .meta-bar {
    display: none;
  }
  .exit-focus {
    display: none;
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 300;
    padding: 7px 12px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
  }
  body.focus-mode .exit-focus { display: block; }

  /* 태블릿 및 모바일 반응형: 자동으로 1단 세로 맞춤 전환 */
  @media (max-width: 960px) {
    header { padding: 8px 12px; gap: 6px; }
    .brand h1 { font-size: 0.95rem; }
    .ep-select { font-size: 0.78rem; padding: 5px 8px; flex: 1; }
    .tabs { width: 100%; justify-content: space-between; }
    .tab-btn { flex: 1; padding: 5px 4px; font-size: 0.75rem; text-align: center; }
    .actions { width: 100%; justify-content: flex-end; }
    .action-btn { padding: 4px 8px; font-size: 0.75rem; }
    main { padding: 8px 10px; gap: 6px; }
    .meta-bar { padding: 6px 10px; font-size: 0.75rem; }
    #readTime { display: none; }
    .book-spread {
      grid-template-columns: 1fr;
      gap: 0;
    }
    #rightPage { display: none; }
    .script-page {
      padding: 16px 14px;
      font-size: 17px;
      line-height: 1.8;
      border-radius: 10px;
    }
    .bottom-bar { padding: 8px 10px; gap: 6px; justify-content: center; }
    .nav-group { width: 100%; justify-content: space-between; }
    .page-btn { flex: 1; padding: 9px 10px; font-size: 0.86rem; }
    .tool-group { width: 100%; justify-content: center; gap: 4px; }
  }
</style>
</head>
<body>

<button class="exit-focus" onclick="toggleFocus()">집중모드 해제</button>

<header>
  <div class="brand-area">
    <div class="brand">
      <h1>차라투스트라의 일상 산책</h1>
    </div>
    <select class="ep-select" id="epSelect" onchange="switchEpisode(this.value)">
      <option value="ep1">1회차 · 서문 (1~10절)</option>
      <option value="ep2">2회차 · 제1부 1장~5장</option>
      <option value="ep3">3회차 · 제1부 6장~10장</option>
      <option value="ep4">4회차 · 제1부 11장~16장</option>
      <option value="ep5">5회차 · 제1부 17장~22장 (완결)</option>
    </select>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('raw', this)">① 원문 낭독</button>
    <button class="tab-btn" onclick="switchTab('broadcast', this)">② 방송용 대본</button>
    <button class="tab-btn" onclick="switchTab('shorts', this)">③ 숏츠 1분</button>
  </div>

  <div class="actions">
    <button class="action-btn" id="editBtn" onclick="toggleEdit()">✏️ 직접 수정</button>
    <button class="action-btn" onclick="resetScript()">↺ 초기화</button>
    <button class="action-btn" onclick="downloadTxt()">💾 .txt 저장</button>
  </div>
</header>

<main>
  <div class="meta-bar">
    <span id="trackTitle">1회차 트랙 ① 원문 낭독</span>
    <span id="readTime">예상 낭독 시간: 약 25~30분</span>
  </div>
  <div class="book-spread" id="bookSpread">
    <div id="leftPage" class="script-page"></div>
    <div id="rightPage" class="script-page"></div>
  </div>
</main>

<div class="bottom-bar">
  <div class="nav-group">
    <button class="page-btn" id="prevBtn" onclick="changePage(-1)">◀ 이전</button>
    <span class="page-indicator" id="pageIndicator">1 / 1</span>
    <button class="page-btn" id="nextBtn" onclick="changePage(1)">다음 ▶</button>
  </div>

  <div class="tool-group">
    <button class="action-btn" id="timerBtn" onclick="toggleTimer()">⏱ <span id="timerDisplay">00:00</span></button>
    <button class="action-btn" onclick="resetTimer()">리셋</button>
    <button class="action-btn" onclick="changeFont(-2)">가-</button>
    <button class="action-btn" onclick="changeFont(2)">가+</button>
    <button class="action-btn" onclick="setTheme('')">미색</button>
    <button class="action-btn" onclick="setTheme('dark')">심야</button>
    <button class="action-btn" onclick="setTheme('prompter')">프롬프터</button>
    <button class="action-btn" onclick="toggleFocus()">집중</button>
  </div>
</div>

<script>
const episodesData = {
  ep1: {
    subTitle: '1회차: 서문 (1~10절) · 유튜브 낭독 & 집필 스튜디오',
    meta: {
      raw: { title: '1회차 트랙 ① 원문 낭독 (머리말 1절~10절 전체)', time: '예상 낭독 시간: 약 25~30분' },
      broadcast: { title: '1회차 트랙 ② 방송용 대본 (인간다움 & 노력 철학 반영 확정본)', time: '예상 낭독 시간: 약 30분' },
      shorts: { title: '1회차 트랙 ③ 숏츠 대본 (수정 확정본)', time: '예상 낭독 시간: 약 50초~1분' }
    },
    scripts: {
      raw: `차라투스트라의 머리말 · 1절

차라투스트라는 서른 살이 되자 고향과 고향의 호수를 떠나 산으로 들어갔다. 그곳에서 그는 자신의 정신과 고독을 즐기며 십 년 동안이나 지치지 않고 머물렀다. 그러나 마침내 그의 마음에 변화가 찾아왔다. 어느 날 아침, 그는 동이 트기도 전에 일어나 태양을 마주 보고 서서 이렇게 말했다.

"위대한 별이여! 네가 비추어 줄 존재들이 없다면 너의 행복이 무엇이겠는가?
십 년 동안이나 너는 나의 동굴 위로 떠올랐다. 만약 나와 나의 독수리와 나의 뱀이 없었다면, 너는 너의 빛과 이 길에 지치고 말았을 것이다.
하지만 우리는 매일 아침 너를 기다렸고, 네게서 넘쳐흐르는 빛을 받아들이며 너를 축복했다.
보라! 나는 이제 나의 지혜에 지쳤다. 마치 꿀을 너무 많이 모은 꿀벌처럼, 내 지혜를 받아 줄 손들이 필요해졌다.
나는 나누어 주고 베풀고 싶다. 인간들 가운데 지혜로운 이들이 다시 한번 자신들의 어리석음을 기뻐하고, 가난한 이들이 다시 한번 자신들의 풍요로움을 기뻐할 때까지.
그러기 위해 나는 깊은 곳으로 내려가야 한다. 저녁 무렵 네가 바다 뒤로 가라앉아 저 아래 세상에도 빛을 가져다주는 것처럼 말이다. 넘쳐흐르는 별이여!
나 역시 너처럼 몰락해야 한다. 내가 내려가고자 하는 인간들이 부르는 말 그대로, 나는 아래로 내려가야 한다.
그러니 나를 축복해 다오, 고요한 눈동자여! 너무나 큰 행복마저도 질투 없이 바라볼 수 있는 그 맑은 눈으로.
넘쳐흐르려는 이 잔을 축복해 다오. 물이 황금빛으로 흘러넘쳐 너의 환희의 빛을 온 세상에 실어 나를 수 있도록.
보라! 이 잔은 다시 비워지기를 원하고, 차라투스트라는 다시 인간이 되기를 원한다."

이렇게 차라투스트라의 몰락이 시작되었다.

---PAGE---

차라투스트라의 머리말 · 2절

차라투스트라는 혼자서 산을 내려왔고, 아무도 마주치지 않았다. 그러나 숲속으로 들어섰을 때, 갑자기 한 노인이 그의 앞에 나타났다. 노인은 뿌리를 캐기 위해 자신의 거룩한 오두막을 떠나 숲을 헤매고 있었다. 노인이 차라투스트라에게 말했다.

"이 나그네는 내게 낯설지 않구나. 몇 해 전 이곳을 지나갔었지. 그의 이름은 차라투스트라였다. 하지만 그때와는 모습이 변했구나.
그때 너는 너의 재를 산으로 짊어지고 올라갔었는데, 오늘은 너의 불꽃을 골짜기로 가져가려는 것이냐? 방화범에게 내려지는 벌이 두렵지 않느냐?
그래, 나는 차라투스트라를 알아본다. 그의 눈은 맑고, 입가에는 어떤 역겨움도 숨어 있지 않다. 춤추는 사람처럼 가볍게 걷고 있지 않은가?
차라투스트라는 변했다. 차라투스트라는 어린아이가 되었다. 차라투스트라는 이제 잠에서 깨어난 자가 되었다. 그런데 잠들어 있는 자들 틈에서 무엇을 하려는 것이냐?
너는 고독 속에서 마치 바다에 있는 것처럼 살았고, 바다가 너를 품어 주었다. 아아, 이제 뭍으로 올라오려 하는가? 아아, 다시 네 스스로 네 몸을 끌고 다니려 하는가?"

차라투스트라가 대답했다. "나는 인간들을 사랑합니다."

성자가 말했다. "내가 숲과 광야로 들어온 이유가 무엇이겠느냐? 내가 인간들을 너무나 사랑했기 때문이 아니겠느냐?
이제 나는 신을 사랑한다. 인간은 사랑하지 않는다. 내게 인간은 너무나 불완전한 존재다. 인간에 대한 사랑은 나를 파멸시킬 것이다."

차라투스트라가 대답했다. "내가 사랑을 말했습니까! 나는 인간들에게 선물을 가져다주려는 것입니다."

성자가 말했다. "그들에게 아무것도 주지 마라. 차라투스트라여, 차라투스트라가 그들의 짐을 덜어 주고 함께 짊어지는 편이 나을 것이다. 그것만으로도 그들에게는 가장 큰 기쁨이 될 테니.
기어이 주고 싶다면, 동냥이나 조금 베풀어라. 그것도 그들이 스스로 구걸하게 만든 뒤에 주어라!"

"아닙니다. 저는 동냥을 베풀지 않습니다. 저는 그럴 만큼 가난하지 않습니다." 차라투스트라가 대답했다.

성자는 차라투스트라를 비웃으며 말했다. "그렇다면 그들이 너의 보물을 받아들이도록 잘해 보아라! 그들은 은둔자들을 믿지 않는다. 우리가 선물을 주러 왔다는 말을 믿지 않는 법이다.
거리를 걷는 우리의 발소리가 그들에게는 너무나 외롭게 들린다. 밤중에 침대에 누워 해가 뜨기 훨씬 전에 걸어가는 사람의 발소리를 들으면, 그들은 '저 도둑이 어디로 가는 걸까?' 하고 의심할 뿐이다.
인간들에게 가지 말고 숲에 머물러라! 차라투스트라여, 차라투스트라가 동물들에게 가는 편이 낫다! 어째서 너는 나처럼 되려 하지 않느냐? 곰들 틈의 곰이 되고, 새들 틈의 새가 되어라."

"그런데 성자께서는 숲속에서 무엇을 하고 계십니까?" 차라투스트라가 물었다.

성자가 대답했다. "나는 노래를 짓고 그 노래를 부른다. 노래를 지을 때면 웃고, 울고, 콧노래를 흥얼거린다. 그렇게 나는 신을 찬양한다.
노래하고, 울고, 웃고, 흥얼거리며 나는 나의 신인 그분을 찬양한다. 그런데 너는 우리에게 무슨 선물을 가져왔느냐?"

또는 진리의 물이라면 더러운 물속에라도 들어가기를 주저하지 않고, 차가운 개구리와 뜨거운 두꺼비를 물리치지 않는 것.
또는 우리를 경멸하는 자들을 사랑하고, 우리에게 겁을 주려 하는 유령에게 손을 내미는 것.

짐을 지는 정신은 이 모든 가장 무거운 짐을 짊어진다. 짐을 가득 싣고 사막을 향해 서둘러 걷는 낙타처럼, 정신 역시 자신의 사막을 향해 서둘러 걸어간다.
그러나 가장 외로운 사막에서 두 번째 변화가 일어난다. 여기서 정신은 사자가 된다. 사자는 자유를 쟁취하려 하고, 자기 자신의 사막에서 주인이 되려 한다.
여기서 사자는 자신의 마지막 주인을 찾는다. 그 주인과 자신의 마지막 신에게 적이 되려 하며, 승리를 위해 거대한 용과 싸우려 한다.
정신이 더 이상 주인이자 신이라 부르고 싶어 하지 않는 그 거대한 용은 누구인가? 그 거대한 용의 이름은 '너는 해야만 한다'이다. 그러나 사자의 정신은 '나는 원한다'라고 말한다.
'너는 해야만 한다'라는 용은 황금빛으로 번쩍이는 비늘을 가진 짐승처럼 길 위에 버티고 서서 그의 길을 가로막는다. 그리고 모든 비늘 위에는 '너는 해야만 한다'라는 글자가 황금빛으로 빛나고 있다.
수천 년 동안 이어져 온 가치들이 그 비늘 위에서 빛나고 있으며, 모든 용 가운데 가장 강력한 그 용은 이렇게 말한다. '사물의 모든 가치가 내 몸 위에서 빛나고 있다. 모든 가치는 이미 창조되었으며, 창조된 모든 가치가 바로 나다. 진실로 더 이상 "나는 원한다"는 존재해서는 안 된다!' 용은 이렇게 말한다.

형제들이여, 정신에 왜 사자가 필요한가? 짐을 지며 경외할 줄 아는 짐승으로는 왜 충분하지 않은가?
새로운 가치를 창조하는 일은 사자조차 아직 해낼 수 없다. 그러나 새로운 창조를 위한 자유를 스스로 만들어 내는 일, 그것은 사자의 힘이 할 수 있는 일이다.
자유를 쟁취하는 것, 그리고 의무에 대해서조차 거룩한 '아니오'라고 말하는 것. 형제들이여, 이를 위해 사자가 필요하다.
새로운 가치를 향한 권리를 쟁취하는 것, 그것이야말로 짐을 지며 경외하던 정신에게는 가장 무서운 약탈이다. 진실로 그 정신에게 그것은 하나의 약탈이자 맹수의 일이다.
한때 그 정신은 '너는 해야만 한다'를 가장 거룩한 것으로 사랑했다. 이제는 그 가장 거룩한 것 속에서조차 환상과 자의를 발견해야만 한다. 그리하여 자신의 사랑으로부터 자유를 약탈해 와야 한다. 이 약탈을 위해 사자가 필요하다.

그러나 형제들이여, 사자조차 할 수 없는 일을 어린아이는 어떻게 할 수 있는가? 약탈하는 사자가 왜 다시 어린아이가 되어야 하는가?
어린아이는 순수함이며 망각이다. 새로운 시작, 하나의 놀이, 스스로 돌아가는 바퀴, 최초의 움직임, 거룩한 '예'라는 긍정이다.
그렇다, 형제들이여, 창조라는 놀이를 위해서는 거룩한 '예'라는 긍정이 필요하다. 이제 정신은 자기 자신의 의지를 원하며, 세계를 잃었던 자가 자기 자신의 세계를 되찾는다.

나는 그대들에게 정신의 세 가지 변화를 말했다. 어떻게 정신이 낙타가 되고, 낙타가 사자가 되며, 마침내 사자가 어린아이가 되는지를.

차라투스트라는 이렇게 말했다. 그때 그는 '얼룩소'라 불리는 도시에 머물고 있었다.

제1부 · 2장. 덕의 강단들에 대하여

사람들은 차라투스트라에게 잠과 덕에 대해 잘 이야기할 줄 아는 한 현자를 칭찬했다. 그는 그 일로 큰 존경과 보답을 받았으며, 모든 젊은이들이 그의 강단 앞에 모여 앉았다. 차라투스트라도 그에게 가서 모든 젊은이들과 함께 강단 앞에 앉았다. 현자는 이렇게 말했다.

"잠을 존경하고 수줍어하라! 이것이 첫 번째다! 그리고 잠을 잘 자지 못하고 밤에 깨어 있는 모든 자들을 피하라!
도둑조차 잠 앞에서는 수줍어한다. 도둑은 언제나 밤을 통해 조용히 몰래 걸어간다. 그러나 밤의 야경꾼은 수줍음이 없다. 그는 수줍음 없이 뿔나팔을 들고 다닌다.
잠자는 것은 결코 사소한 기술이 아니다. 그것을 위해서는 온종일 깨어 있어야 한다.
낮 동안 열 번은 자기 자신을 극복해야 한다. 그것은 기분 좋은 피로를 가져다주며, 영혼의 양귀비가 된다.
열 번은 다시 자기 자신과 화해해야 한다. 극복은 쓰라린 것이며, 화해하지 못한 자는 잠을 잘 못 자기 때문이다.
낮 동안 열 개의 진리를 찾아내야 한다. 그렇지 않으면 밤중에도 진리를 찾게 되고, 영혼이 굶주린 채로 남게 된다.
낮 동안 열 번은 웃고 명랑해야 한다. 그렇지 않으면 밤의 아버지인 위장이 밤중에 그대를 괴롭힐 것이다.
이 사실을 아는 사람은 적다. 그러나 잘 자기 위해서는 모든 덕을 갖추고 있어야 한다. 내가 거짓 증언을 할 것인가? 내가 간음을 할 것인가?
내가 이웃의 하녀를 탐낼 것인가? 이 모든 것은 좋은 잠과 어울리지 않는다.
설령 모든 덕을 다 갖추고 있더라도, 한 가지는 더 이해해야 한다. 덕들마저 제때에 잠들게 하는 법을 말이다.
그 착한 여인들끼리 서로 다투지 않도록! 그것도 그대 때문에 다투지 않도록, 불행한 자여!
신과 이웃과 화평하라. 좋은 잠은 그것을 원한다. 이웃의 악마와도 화평하라! 그렇지 않으면 그 악마가 밤에 그대를 찾아올 것이다.
권력자를 존경하고 복종하라. 설령 그가 비뚤어진 권력자라 할지라도! 좋은 잠은 그것을 원한다. 권력이 비뚤어진 다리로 걷기를 좋아한다 해서 내가 어찌하겠는가?
양 떼를 가장 푸른 초장으로 데려가는 자를 나는 언제나 최고의 목자라 부르리라. 이것이 좋은 잠과 어울린다.
나는 많은 명예도 원하지 않고 큰 보물도 원하지 않는다. 그것은 비장을 붓게 만든다. 그러나 좋은 평판과 작은 보물이 없이는 잠을 잘 못 잔다.
나쁜 무리보다는 작은 무리가 내게 더 반갑다. 다만 그들이 제때에 오고 제때에 떠나야 한다. 이것이 좋은 잠과 어울린다.
가난한 정신을 가진 자들도 내 마음에 든다. 그들은 잠을 촉진한다. 특히 그들이 언제나 옳다고 맞장구쳐 줄 때 그들은 복되다.
덕이 있는 자의 낮이 이렇게 흘러간다. 이제 밤이 찾아오면, 나는 잠을 부르지 않도록 조심한다! 모든 덕의 주인인 잠은 불려 오는 것을 원하지 않기 때문이다!
오히려 나는 낮 동안 무엇을 했고 무엇을 생각했는지 떠올린다. 소처럼 되새김질하며 인내심을 갖고 나 자신에게 묻는다. '너의 열 번의 극복은 무엇이었는가?'
그리고 '열 개의 화해와 열 개의 진리와 열 번의 웃음은 무엇이었는가? 내 마음이 그것으로 배불리 먹었는가?'
이런저런 생각을 떠올리며 마흔 개의 생각에 흔들리다 보면, 갑자기 모든 덕의 주인인 불려 오지 않은 잠이 나를 덮친다.
잠이 내 눈을 두드리면 눈이 무거워진다. 잠이 내 입을 스치면 입이 열린다.
진실로 잠은 가장 사랑스러운 도둑처럼 부드러운 발걸음으로 다가와 내 생각을 훔쳐 간다. 그러면 나는 이 강단처럼 멍하니 서 있게 된다.
그러나 나는 오래 서 있지 못한다. 이미 나는 누워 있다."

차라투스트라는 현자가 이렇게 말하는 것을 듣고 속으로 웃었다. 그에게 빛이 떠올랐기 때문이다. 그는 마음속으로 이렇게 말했다.
"마흔 개의 생각을 가진 이 현자는 내게 어리석은 자로 보인다. 그러나 나는 그가 잠자는 법만큼은 잘 이해하고 있다고 믿는다.
이 현자 곁에 사는 자는 복되다! 그런 잠은 전염되니 말이다. 두꺼운 벽을 뚫고서라도 전염된다.
그의 강단 안에조차 마법이 깃들어 있다. 젊은이들이 이 덕의 설교자 앞에 헛되이 앉아 있는 것이 아니다.
그의 지혜는 이렇다. 잠을 잘 자기 위해 깨어 있으라는 것! 진실로 삶에 아무런 의미가 없고 내가 무의미한 것을 선택해야 한다면, 내게도 이것이 가장 선택할 만한 무의미일 것이다.
이제 나는 사람들이 예전에 덕의 스승들을 찾을 때 무엇을 무엇보다 먼저 찾았는지 분명히 알겠다. 그들은 좋은 잠과 그에 어울리는 양귀비 같은 덕을 찾았던 것이다!
강단에 앉은 이 모든 칭송받는 현자들에게 지혜란 꿈 없는 잠이었다. 그들은 삶에 대해 그보다 더 나은 의미를 알지 못했다.
오늘날에도 이 덕의 설교자 같은 이들이 몇몇 남아 있다. 비록 그처럼 정직하지는 않더라도 말이다. 그러나 그들의 시대는 끝났다. 그들은 이제 오래 서 있지 못할 것이다. 이미 그들은 누워 있다.
졸고 있는 자들은 복되다. 그들은 곧 잠에 빠질 것이기 때문이다."

차라투스트라는 이렇게 말했다.

제1부 · 3장. 배후 세계론자들에 대하여

한때 차라투스트라 역시 모든 배후 세계론자들처럼 인간 너머에 자신의 망상을 던진 적이 있었다. 그때 그에게 세계는 고통받고 고뇌하는 어떤 신의 작품처럼 보였다.
그때 세계는 그에게 꿈처럼 보였고, 한 신의 시적 허구처럼 보였다. 불만족스러운 신의 눈앞에 피어오르는 색색의 연기처럼 보였다.
선과 악, 기쁨과 고통, 나와 너 — 이 모든 것이 창조자의 눈앞에 피어오르는 색색의 연기처럼 그에게 보였다. 창조자는 자기 자신으로부터 시선을 돌리고 싶어 했고, 그리하여 세계를 창조했던 것이다.
고통받는 자가 자신의 고통에서 눈을 돌리고 자기 자신을 잊는 것은 도취된 기쁨이다. 한때 나에게 세계는 도취된 기쁨이자 자기 망각으로 보였다.
영원히 불완전한 이 세계, 영원한 모순의 모사이며 불완전한 모사인 이 세계는 그 불완전한 창조자에게 도취된 기쁨이다. 한때 나에게 세계는 그렇게 보였다.
그리하여 나 역시 모든 배후 세계론자들처럼 인간 너머에 나의 망상을 던졌던 것이다. 정말로 인간 너머에 무엇이 있단 말인가?

아, 형제들이여, 내가 창조했던 그 신은 인간의 작품이자 인간의 광기였다. 모든 신들이 그러하듯이!
그는 인간이었고, 인간과 자아의 가련한 조각에 불과했다. 내 자신의 재와 불꽃으로부터 그 유령이 내게 다가왔다. 진실로 그것은 저편 세계에서 내게 온 것이 아니었다!
형제들이여, 무슨 일이 일어났던가? 고통받고 버림받은 자인 내가 나 자신을 극복했고, 나의 재를 산으로 짊어지고 올라가 나 자신을 위해 더 밝은 불꽃을 발명해 냈다. 그러자 보라! 그 유령이 내게서 물러갔다!
이제 회복된 내가 그런 유령들을 믿는 것은 고통이자 고문이 될 것이다. 이제 그것은 내게 고통이자 굴욕이 될 것이다. 나는 배후 세계론자들에게 이렇게 말한다.

고통과 무능력이 모든 배후 세계를 창조했다. 그리고 가장 고통받는 자만이 경험하는 저 짧은 행복의 광기가 그것을 창조했다.
한 번의 도약으로, 죽음의 도약으로 궁극에 도달하고자 하는 피로, 더 이상 원하기조차 원하지 않는 가련하고 무지한 피로, 그것이 모든 신들과 배후 세계를 창조했다.

형제들이여, 나를 믿어라! 육체에 대해 절망한 것이 바로 육체였다. 병든 정신의 손가락으로 궁극의 벽을 더듬었던 것이다.
형제들이여, 나를 믿어라! 대지에 대해 절망한 것이 바로 육체였다. 존재의 배가 자기에게 말하는 소리를 들었던 것이다.
그러자 육체는 머리로, 머리로만 궁극의 벽을 뚫고 저편 세계로 건너가려 했다.
그러나 '저편 세계'는 인간에게 잘 숨겨져 있다. 비인간적이고 비인격적인 저 세계, 천상의 허무인 저 세계 말이다. 그리고 존재의 배는 인간으로서가 아니면 인간에게 전혀 말을 걸지 않는다.

진실로 모든 존재를 증명하기는 어렵고, 존재로 하여금 말하게 하기는 더욱 어렵다. 형제들이여, 내게 말해 보라. 모든 사물 가운데 가장 기이한 것이 가장 잘 증명되지 않았는가?
그렇다, 이 자아와 자아의 모순과 혼란이 자신의 존재에 대해 가장 정직하게 말한다. 이 창조하고 의욕하고 평가하는 자아, 사물의 척도이자 가치인 자아가 말이다.
그리고 이 가장 정직한 존재인 자아는 육체에 대해 말한다. 설령 시를 짓고 열광하며 부러진 날개로 퍼덕일 때조차도 여전히 육체를 원한다.
자아는 점점 더 정직하게 말하는 법을 배운다. 그리고 더 많이 배울수록 육체와 대지를 찬양하는 더 많은 말과 명예를 찾아낸다.
나의 자아는 내게 새로운 자긍심을 가르쳐 주었고, 나는 그것을 인간들에게 가르친다. 더 이상 천상의 사물 속으로 머리를 파묻지 말고, 대지의 의미를 창조하는 지상의 머리를 당당히 쳐들라고 말이다!

나는 인간들에게 새로운 의지를 가르친다. 인간이 눈먼 채 걸어왔던 그 길을 스스로 원하며 걸어가라고, 그 길을 선하다고 긍정하라고, 그리고 병든 자들과 죽어 가는 자들처럼 그 길에서 몰래 빠져나가지 말라고 말이다!
육체와 대지를 경멸하고 천상의 것과 구원의 핏방울을 발명해 낸 자들은 바로 병든 자들과 죽어 가는 자들이었다. 그러나 이 달콤하고 음침한 독마저도 그들은 육체와 대지로부터 빌려 온 것이었다!
그들은 자신들의 비참함에서 벗어나고 싶었지만, 별들은 그들에게 너무 멀리 있었다. 그래서 그들은 탄식했다. '아, 몰래 저세상으로 빠져나갈 천상의 길들이 있다면 얼마나 좋을까!' 그리하여 그들은 자신들의 샛길과 피의 음료들을 발명해 냈던 것이다!
이제 이 배은망덕한 자들은 자신들이 육체와 이 대지로부터 벗어나 있다고 망상했다. 그러나 그들이 벗어났다는 경련과 황홀감은 누구 덕분이었는가? 바로 그들의 육체와 이 대지 덕분이었다!

차라투스트라는 병든 자들에게 관대하다. 진실로 그는 그들이 위로받는 방식과 그들의 배은망덕함에 화내지 않는다. 그들이 회복되는 자가 되고, 극복하는 자가 되며, 스스로에게 더 높은 육체를 창조하기를 바랄 뿐이다!
차라투스트라는 회복된 자가 자신의 망상을 다정히 돌아보며 자정의 무덤 주위를 살며시 배회할 때에도 화내지 않는다. 그러나 그의 눈물은 여전히 내게 병과 병든 육체를 말해 준다.
병들고 영감을 받은 자들의 무리 속에는 언제나 많은 사람들이 있었고, 그들은 신에 대해 열광하는 자들을 미워한다. 그들은 인식하는 자와 모든 덕 가운데 가장 젊은 덕, 즉 '정직'이라 불리는 덕을 가장 증오한다.
그들은 언제나 어두운 시대를 뒤돌아본다. 그때는 신앙과 망상이 다른 것이었기 때문이다. 이성의 광기가 신과 같았고, 의심이 죄악이었기 때문이다.
나는 신과 같은 이 자들을 너무나 잘 안다. 그들은 자신들이 믿어지기를 원하며, 의심은 죄악이라고 말한다. 나는 또한 그들이 무엇을 가장 잘 믿는지도 너무나 잘 안다.
진실로 배후 세계나 구원의 핏방울이 아니라, 그들 역시 육체를 가장 잘 믿는다. 그들에게는 그들 자신의 육체가 바로 그들 자신의 물자체(사물 그 자체)이다.
그러나 그들에게 육체는 병든 물건이며, 그들은 기꺼이 그 가죽에서 빠져나가고 싶어 한다. 그래서 그들은 죽음의 설교자들에게 귀를 기울이고, 스스로도 배후 세계를 설교하는 것이다.

형제들이여, 차라리 건강한 육체의 목소리에 귀를 기울여라! 그것은 더 정직하고 더 순수한 목소리다.
건강한 육체, 완전하고 직각을 이룬 육체는 더 정직하고 더 순수하게 말한다. 그리고 그것은 대지의 의미에 대해 말한다.

차라투스트라는 이렇게 말했다.

---PAGE---

제1부 · 4장. 육체를 경멸하는 자들에 대하여

나는 육체를 경멸하는 자들에게 한마디 하려 한다. 그들이 다시 배우거나 가르칠 필요는 없다. 다만 자기 자신의 육체와 작별하고, 그리하여 침묵하기만 하면 된다.

"나는 육체이자 영혼이다." 어린아이는 이렇게 말한다. 어째서 어린아이처럼 말해서는 안 되는가?
그러나 잠에서 깨어난 자, 인식하는 자는 이렇게 말한다. "나는 온전히 육체일 뿐, 그 밖의 아무것도 아니다. 영혼이란 육체 안의 어떤 것을 가리키는 말일 뿐이다."

육체는 하나의 커다란 이성이며, 하나의 의미를 지닌 다수성이고, 전쟁이자 평화이며, 양 떼이자 목자다.
형제여, 네가 '정신'이라 부르는 너의 작은 이성 역시 너의 육체의 도구일 뿐이다. 너의 커다란 이성의 작은 도구이자 장난감일 뿐이다.
너는 '나'라고 말하며 이 말을 자랑스러워한다. 그러나 네가 믿고 싶어 하지 않는 더 위대한 것 — 그것은 너의 육체와 너의 커다란 이성이다. 그것은 '나'라고 말하지 않고, '나'를 행한다.

감각이 느끼는 것, 정신이 인식하는 것은 결코 그 자체 안에 끝을 가지고 있지 않다. 그러나 감각과 정신은 자신들이 모든 사물의 끝이라고 너를 설득하려 든다. 그만큼 그들은 허영심이 강하다.
감각과 정신은 도구이자 장난감이다. 그 뒤에는 여전히 '자기(Selbst)'가 놓여 있다. 자기는 감각의 눈으로도 찾고, 정신의 귀로도 듣는다.
자기는 언제나 귀를 기울이고 찾는다. 그것은 비교하고, 강제하고, 정복하고, 파괴한다. 그것은 지배하며, '나'의 지배자이기도 하다.
형제여, 너의 생각과 느낌 뒤에는 강력한 지배자, 알지 못하는 현자가 서 있다. 그의 이름은 '자기'다. 너의 육체 안에 그가 살고 있으며, 그가 바로 너의 육체다.

너의 최선의 지혜보다 너의 육체 안에 더 많은 이성이 들어 있다. 그런데 너의 육체가 어째서 바로 너의 최선의 지혜를 필요로 하는지 누가 알겠는가?
너의 자기는 너의 '나'와 그 자랑스러운 도약들을 비웃는다. "생각의 그 도약과 비상이 내게 무엇이란 말인가?" 자기는 속으로 말한다. "내 목적을 향한 우회로일 뿐이다. 나는 '나'의 고삐를 쥔 자이며, '나'의 개념들을 불어넣는 자다."

자기는 '나'에게 말한다. "여기서 고통을 느껴라!" 그러면 '나'는 고통을 느끼고, 어떻게 하면 더 이상 고통받지 않을지 생각한다. 바로 그것을 위해 '나'는 생각해야만 한다!
자기는 '나'에게 말한다. "여기서 기쁨을 느껴라!" 그러면 '나'는 기뻐하고, 어떻게 하면 자주 기뻐할 수 있을지 생각한다. 바로 그것을 위해 '나'는 생각해야만 한다!

나는 육체를 경멸하는 자들에게 한마디 하고자 한다. 그들이 경멸하는 것, 그것이 바로 그들의 존경을 만들어 낸다. 존경과 경멸과 가치와 의지를 창조한 것은 무엇인가?
창조하는 자기가 스스로를 위해 존경과 경멸을 창조했고, 기쁨과 고통을 창조했다. 창조하는 육체가 자신의 의지의 손으로서 스스로를 위해 정신을 창조했던 것이다.
육체를 경멸하는 자들이여, 그대들의 어리석음과 경멸 속에서조차 그대들은 그대들의 자기를 섬기고 있다. 나는 그대들에게 말한다. 그대들의 자기 자신이 죽기를 원하며 삶으로부터 외면하고 있는 것이다.
그대들의 자기는 자신이 가장 원하는 일, 즉 자기 자신을 넘어서는 창조를 더 이상 할 수 없게 되었다. 그것을 가장 원하며, 그것이 자기의 온전한 열정이다.
그러나 이제 자기는 그렇게 하기에 너무 늦어 버렸다. 그러니 육체를 경멸하는 자들이여, 그대들의 자기는 몰락하기를 원한다.
육체를 경멸하는 자들이여, 그대들의 자기는 몰락하기를 원하며, 그리하여 그대들은 육체를 경멸하는 자가 된 것이다! 그대들은 더 이상 자기 자신을 넘어서는 창조를 할 수 없기 때문이다.
그리하여 그대들은 이제 삶과 대지에 화를 내고 있다. 그대들의 경멸하는 곁눈질 속에는 무의식적인 질투가 숨어 있다.

나는 그대들의 길을 가지 않는다, 육체를 경멸하는 자들이여! 그대들은 내게 위버멘쉬로 가는 다리가 아니다!

차라투스트라는 이렇게 말했다.

---PAGE---

제1부 · 5장. 환희와 열정에 대하여

형제여, 그대에게 하나의 덕이 있고 그것이 그대의 덕이라면, 그대는 그 덕을 아무와도 함께 나누어 가지지 않는다.
물론 그대는 그 덕을 이름으로 부르고 어루만지고 싶어 할 것이다. 그 덕의 귀를 잡아당기며 그 덕과 함께 시간을 보내고 싶어 할 것이다.
그러면 보라! 그대는 그 덕의 이름을 백성과 함께 가지게 되었고, 그대의 덕과 함께 백성이자 양 떼가 되어 버렸다!
차라투스트라가 권하노니 차라리 이렇게 말하라. "내 영혼에 고통과 달콤함을 주고, 내 내장의 배고픔이기도 한 그것은 이름 붙일 수 없고 말로 표현할 수 없는 것이다."

그대의 덕은 이름들의 친숙함을 넘어서 너무나 높은 곳에 있게 하라. 그리고 그대가 그 덕에 대해 말해야만 한다면, 그 덕에 대해 말더듬는 것을 부끄러워하지 마라.
그때 이렇게 말하며 더듬거려라. "이것은 나의 선이다. 나는 이것을 사랑한다. 이것이 온전히 내 마음에 든다. 나는 오직 이렇게만 선을 원한다.
나는 그것을 어떤 신의 법으로 원하지 않으며, 어떤 인간의 규율이나 필요로도 원하지 않는다. 그것은 내게 어떤 저세상이나 낙원으로 가는 이정표가 아니다.
내가 사랑하는 것은 지상의 덕이다. 거기에는 영리함이 적고, 모든 사람의 이성은 가장 적게 들어 있다.
그러나 이 새는 내 곁에 둥지를 틀었다. 그래서 나는 이 새를 사랑하고 품어 준다. 이제 이 새는 내 곁에서 자신의 황금 알을 품고 앉아 있다."

그대는 이렇게 더듬거리며 그대의 덕을 찬양해야 한다.
한때 그대는 열정들을 가지고 있었고, 그것들을 악하다고 불렀다. 그러나 이제 그대에게는 오직 그대의 덕들만이 남아 있다. 그것들은 그대의 열정으로부터 자라난 것이다.
그대는 그 열정들의 가슴속에 그대의 가장 높은 목표를 심어 주었다. 그리하여 그 열정들은 그대의 덕이자 환희가 되었다.
설령 그대가 화를 잘 내는 사람들의 족속이든, 음욕에 빠진 자들의 족속이든, 광신도들의 족속이든, 복수심에 불타는 자들의 족속이든 상관없다.
마침내 그대의 모든 열정은 덕이 되었고, 그대의 모든 악마는 천사가 되었다.
한때 그대의 지하실에는 사나운 개들이 갇혀 있었다. 그러나 마침내 그 개들은 새와 사랑스러운 노래하는 존재들로 변했다.
그대는 그대의 독으로부터 그대의 향유를 빚어냈다. 그대는 슬픔이라는 암소의 젖을 짰고, 이제 그대는 그 암소 젖통의 달콤한 젖을 마신다.

이제 그대에게서 더 이상 어떤 악도 자라나지 않는다. 그대의 덕들 사이의 싸움에서 자라나는 악이 아니라면 말이다.
형제여, 그대에게 행운이 있다면 그대는 하나의 덕만을 가지고 있고 그 이상은 가지지 않는다. 그러면 그대는 다리를 더 가볍게 건널 것이다.
많은 덕을 가지는 것은 명예로운 일이지만, 무거운 운명이기도 하다. 많은 사람들이 사막으로 들어가 스스로 목숨을 끊었는데, 그들은 덕들의 싸움터이자 전쟁터가 되는 일에 지쳤기 때문이다.
형제여, 전쟁과 싸움은 악한 것인가? 그러나 이 악은 필연적이다. 그대의 덕들 사이의 질투와 불신과 비방은 필연적이다.
보라, 어떻게 각각의 덕이 가장 높은 곳을 갈망하는지를. 각각의 덕은 그대의 온전한 정신을 원한다. 그 정신이 자신의 전령이 되기를 원하기 때문이다. 각각의 덕은 분노와 증오 속에서 그대의 온전한 힘을 원한다.
모든 덕은 다른 덕을 질투하며, 질투는 무서운 것이다. 덕들조차 질투로 인해 파멸할 수 있다.
질투의 불꽃에 둘러싸인 자는 마침내 전갈처럼 자기 자신을 향해 독침을 돌린다.
아, 형제여, 그대는 아직 한 번도 덕이 자기 자신을 비방하고 자기 자신을 찌르는 것을 본 적이 없는가?
인간은 극복되어야 할 그 무엇이다. 그러므로 그대는 그대의 덕들을 사랑해야 한다. 그대는 그 덕들로 인해 몰락할 것이기 때문이다.

차라투스트라는 이렇게 말했다.`,

모든 쓰인 것 가운데 나는 오직 사람이 자기 피로 쓴 것만을 사랑한다. 피로 써라. 그러면 너는 피가 곧 정신임을 알게 될 것이다.
남의 피를 이해하기는 쉽지 않다. 나는 게으른 독자들을 미워한다.
독자를 아는 자는 더 이상 독자를 위해 아무것도 하지 않는다. 독자들이 한 세기만 더 지나면 정신마저 악취를 풍길 것이다.
누구나 읽기를 배울 수 있게 된 것은 장기적으로 글쓰기뿐만 아니라 생각하기마저 망쳐 놓는다.
한때 정신은 신이었고, 그다음에는 인간이 되었으며, 이제는 천민마저 되어 버렸다.

피와 잠언으로 쓰는 자는 읽히기를 원하지 않고, 외워지기를 원한다.
산속에서는 가장 가까운 길이 봉우리에서 봉우리로 건너가는 길이다. 그러나 그러려면 긴 다리가 있어야 한다. 잠언들은 봉우리여야 하며, 잠언이 말을 거는 대상은 키가 크고 당당한 사람들이어야 한다.
공기는 맑고 순수하며, 위험이 가까이 있고, 정신은 즐거운 악의로 가득 차 있다. 이것들은 서로 잘 어울린다.
나는 내 주위에 도깨비들을 두고 싶다. 내가 용기 있기 때문이다. 유령들을 쫓아내는 용기는 스스로 도깨비를 만들어 낸다. 용기는 웃기를 원한다.

나는 더 이상 그대들과 함께 느끼지 않는다. 내가 내 발아래로 내려다보는 이 구름, 내가 비웃는 이 검고 무거운 구름 — 바로 이것이 그대들의 폭풍우 구름이다.
그대들은 고양되기를 갈망할 때 위를 올려다본다. 나는 이미 고양되었기에 아래를 내려다본다.
그대들 가운데 누가 동시에 웃으면서 고양될 수 있는가?
가장 높은 산에 오르는 자는 모든 비극적 연극과 비극적 현실을 비웃는다.

용기 있고, 근심 없고, 조롱하고, 폭력적인 것 — 지혜는 우리가 그러하기를 원한다. 지혜는 여인이며, 언제나 오직 전사만을 사랑한다.

그대들은 내게 말한다. "삶은 짊어지기 어렵다." 그러나 그렇다면 오전에는 왜 그렇게 자긍심을 부리고, 저녁에는 왜 그렇게 체념하는가?
삶은 짊어지기 어렵다. 그러나 내 앞에서 그렇게 나약한 척하지 마라! 우리는 모두 짐을 잘 싣는 귀여운 수나귀와 암나귀들이다.
눈물을 찔끔거리며 한탄하는 꽃봉오리와 우리가 무슨 상관이 있겠는가? 단지 이슬방울 하나가 몸 위에 내려앉았을 뿐인데도 떠는 그 꽃봉오리와 말이다.

우리가 삶을 사랑하는 것은 삶에 익숙해져서가 아니라 사랑에 익숙해져 있기 때문이다.
사랑 속에는 언제나 약간의 광기가 들어 있다. 그러나 광기 속에도 언제나 약간의 이성이 들어 있다.
그리고 삶을 사랑하는 나에게도 나비와 비눗방울, 그리고 인간들 가운데 그것들과 닮은 존재들이 행복에 대해 가장 많이 아는 것처럼 보인다.
이 가볍고 어리석고 우아하고 움직이기 쉬운 작은 영혼들이 펄럭이는 것을 보는 것 — 그것이 차라투스트라를 눈물과 노래로 이끈다.

나는 오직 춤출 줄 아는 신만을 믿으리라.
그리고 내가 나의 악마를 보았을 때, 나는 그가 진지하고 철저하며 깊고 엄숙한 것을 보았다. 그것은 '중력의 영'이었다. 그로 인해 모든 사물이 추락한다.
사람은 분노가 아니라 웃음으로 죽인다. 일어나라, 우리 함께 중력의 영을 죽이자!

나는 걷는 법을 배웠다. 그 뒤로 나는 달린다. 나는 날아오르는 법을 배웠다. 그 뒤로 나는 움직이기 위해 누군가 나를 밀어 주기를 기다리지 않는다.
이제 나는 가볍고, 이제 나는 날아오르며, 이제 나는 내 발아래로 나 자신을 본다. 이제 내 안에서 한 신이 춤을 춘다.

차라투스트라는 이렇게 말했다.

---PAGE---

제1부 · 8장. 산기슭의 나무에 대하여

차라투스트라는 한 젊은이가 자신을 피하고 있다는 것을 알아차렸다. 어느 날 저녁, 그가 '얼룩소'라 불리는 도시를 둘러싼 산기슭을 혼자 걷고 있을 때, 보라! 그는 걸어가다가 한 젊은이가 나무에 기대어 앉아 지친 눈길로 골짜기를 내려다보고 있는 것을 발견했다. 차라투스트라는 젊은이가 기대고 있는 그 나무를 붙잡고 이렇게 말했다.

"내가 이 나무를 내 손으로 흔들려 해도 나는 그럴 수 없을 것이다.
그러나 우리가 보지 못하는 바람이 이 나무를 괴롭히고 자기가 원하는 곳으로 휘어 놓는다. 보이지 않는 손들에 의해 우리는 가장 심하게 휘어지고 괴롭힘을 당한다."

그러자 젊은이는 놀란 듯 몸을 일으키며 말했다. "차라투스트라의 목소리가 들리는군요. 방금 제가 바로 그분에 대해 생각하고 있었는데!"
차라투스트라가 대답했다. "그것 때문에 왜 놀라느냐? 인간에게도 나무와 똑같은 일이 일어난다.
그가 높이와 빛을 향해 올라가려 하면 할수록, 그의 뿌리는 더욱 힘차게 땅속으로, 아래로, 어둠 속으로, 깊은 곳으로 — 악 속으로 파고든다."

"그렇습니다, 악 속으로!" 젊은이가 외쳤다. "어떻게 당신이 제 영혼을 발견해 내셨습니까?"

차라투스트라는 미소를 지으며 말했다. "어떤 영혼들은 결코 발견되지 않을 것이다. 먼저 그것을 발명해 내지 않는다면 말이다."

"그렇습니다, 악 속으로!" 젊은이가 다시 외쳤다.
"차라투스트라여, 당신은 진실을 말씀하셨습니다. 제가 높은 곳을 믿기 시작한 뒤로 저는 더 이상 저 자신을 믿지 못하게 되었습니다. 그리고 이제 아무도 저를 믿지 않습니다. 어떻게 이런 일이 일어났을까요?
저는 너무 빨리 변합니다. 저의 오늘이 저의 어제를 반박합니다. 저는 올라갈 때 종종 계단을 뛰어넘습니다. 어떤 계단도 그것을 용서하지 않습니다.
제가 위에 올라가 있으면, 저는 언제나 혼자입니다. 아무도 제게 말을 걸지 않고, 고독의 서리가 저를 떨게 만듭니다. 제가 높은 곳에서 무엇을 원한단 말입니까?
저의 경멸과 저의 동경이 함께 자라납니다. 제가 높이 올라가면 올라갈수록, 올라가는 자를 더욱 경멸하게 됩니다. 그가 높은 곳에서 무엇을 원한단 말입니까?
제가 오르는 일과 비틀거리는 일을 얼마나 부끄러워하는지! 제가 격렬하게 숨을 헐떡이는 것을 얼마나 비웃는지! 날아오르는 자를 얼마나 미워하는지! 높은 곳에서 제가 얼마나 지쳐 있는지!"

여기서 젊은이는 침묵했다. 그리고 차라투스트라는 두 사람이 서 있는 나무를 바라보며 이렇게 말했다.

"이 나무는 여기 산속에 홀로 서 있다. 인간과 짐승을 넘어 높이 자라났다.
만약 이 나무가 말하려 한다면, 이 나무를 이해할 자가 아무도 없을 것이다. 그만큼 높이 자라났기 때문이다.
이제 이 나무는 기다리고 또 기다린다. 대체 무엇을 기다리고 있는 것일까? 구름의 거처와 너무 가까이 살고 있으니, 아마도 첫 번째 번개를 기다리고 있을 것이다."

차라투스트라가 이 말을 마치자 젊은이는 격렬한 몸짓으로 외쳤다. "그렇습니다, 차라투스트라여, 당신은 진실을 말씀하십니다. 제가 높은 곳을 동경할 때 저는 저의 파멸을 갈망했고, 당신은 제가 기다리던 바로 그 번개입니다! 보십시오, 당신이 우리 곁에 나타난 뒤로 저는 무엇이 되었습니까? 당신에 대한 질투가 저를 파멸시켰습니다!" 젊은이는 이렇게 말하고 쓰디쓴 눈물을 흘렸다. 그러나 차라투스트라는 팔로 그를 감싸 안고 함께 걸어갔다.

잠시 함께 걸은 뒤 차라투스트라가 입을 열었다.

"내 마음을 찢어 놓는구나. 네 눈물이 네 말보다 더 잘 말해 주는구나. 네가 처한 모든 위험을 말이다.
너는 아직 자유롭지 못하다. 너는 아직 자유를 찾고 있다. 너의 탐색이 너를 밤새 깨어 있게 하고, 너무 지치게 만들었다.
너는 자유로운 높은 곳으로 가고 싶어 하고, 너의 영혼은 별들을 갈망한다. 그러나 너의 악한 충동들 역시 자유를 갈망한다.
너의 야생 개들은 자유로워지고 싶어 한다. 그들은 네 영혼이 모든 감옥을 열려고 애쓸 때 지하실에서 기뻐하며 짖어 댄다.
내게 너는 아직 자유를 꿈꾸는 죄수일 뿐이다. 아, 그런 죄수들의 영혼은 영리해지지만, 동시에 교활하고 비열해진다.
자유로워진 영혼조차도 여전히 자기 자신을 정화해야 한다. 그 영혼 안에는 아직도 감옥과 곰팡이가 많이 남아 있다. 그의 눈은 여전히 순수해져야 한다.

그렇다, 나는 너의 위험을 안다. 그러나 나의 사랑과 희망에 걸고 네게 부탁하노니, 너의 사랑과 희망을 내던지지 마라!
너는 아직 너 자신을 고귀하게 느끼고 있으며, 너를 미워하고 너에게 사악한 눈길을 보내는 자들 역시 여전히 너를 고귀하게 느낀다. 고귀한 자는 모든 사람의 길을 가로막는다는 사실을 알라.
선한 자들의 길도 고귀한 자가 가로막는다. 설령 그들이 고귀한 자를 선하다고 부를지라도, 그들은 그렇게 부름으로써 그를 옆으로 치워 버리려 하는 것이다.
고귀한 자는 새로운 것을 창조하려 하고 새로운 덕을 창조하려 한다. 선한 자는 옛것을 원하며, 옛것이 보존되기를 원한다.
그러나 고귀한 자의 위험은 그가 선한 자가 되는 데 있지 않고, 그가 오만한 자, 조롱하는 자, 파괴자가 되는 데 있다.
아, 나는 자신의 가장 높은 희망을 잃어버린 고귀한 자들을 보았다. 그때부터 그들은 모든 높은 희망을 비방했다.
그때부터 그들은 짧은 쾌락 속에서 뻔뻔스럽게 살았고, 하루살이 이상의 목표를 거의 세우지 않았다.
'정신 또한 쾌락일 뿐이다.' 그들은 이렇게 말했다. 그러자 그들의 정신의 날개가 부러졌고, 이제 그들의 정신은 기어 다니며 모든 것을 갉아먹어 더럽힌다.
한때 그들은 영웅이 되기를 생각했으나, 이제는 음탕한 자들이 되었다. 영웅은 그들에게 근심이자 공포일 뿐이다.

그러나 나의 사랑과 희망에 걸고 네게 부탁하노니, 네 영혼 속의 영웅을 내던지지 마라! 너의 가장 높은 희망을 거룩하게 간직하라!"

차라투스트라는 이렇게 말했다.

제1부 · 9장. 죽음의 설교자들에 대하여

죽음의 설교자들이 있다. 그리고 대지에는 삶으로부터 돌아서라고 설교해야 할 자들이 가득 차 있다.
대지에는 불필요한 자들이 가득 차 있고, 삶은 그 너무나 많은 자들에 의해 망가져 있다. 그들이 '영원한 삶'이라는 미끼로 이 삶에서 유인되어 떠나기를!
노란 자들이여, 또는 검은 자들이여, 나는 그들을 죽음의 설교자라 부른다. 그러나 나는 그들을 다른 색깔로도 그대들에게 보여 주고 싶다.
이들은 끔찍한 자들이며, 자기 안에 야수를 품고 있고, 쾌락이나 자기 학대 외에는 선택할 것이 없다. 그리고 그들의 쾌락조차도 여전히 자기 학대다.
이들은 아직 인간이 되지도 못한 자들이다. 이 끔찍한 자들이여! 이들이 삶으로부터 돌아서라고 설교하고 스스로도 떠나 버리기를!

이들은 영혼의 폐병에 걸린 자들이다. 태어나자마자 이미 죽기 시작하며, 피로와 체념의 가르침을 갈망한다.
그들은 기꺼이 죽고 싶어 하고, 우리는 그들의 소원을 들어주어야 한다! 우리가 이 죽은 자들을 다시 깨우지 않도록, 그리고 이 살아 있는 관들을 상하게 하지 않도록 조심하자!
그들은 병든 자나 노인이나 시체를 만나면 곧바로 말한다. "삶은 반박되었다!"
그러나 반박된 것은 오직 그들 자신과 그들의 눈뿐이다. 그들은 존재의 단 한 가지 얼굴만을 본다.
짙은 우울에 잠기고, 죽음을 가져오는 작은 우연들을 갈망하는 자들 — 그렇게 그들은 이를 악물고 기다린다.
또는 그들은 단것을 손을 뻗어 잡으면서 동시에 자신들의 유치함을 비웃는다. 그들은 한 가닥 지푸라기 같은 삶에 매달려 있으면서도, 자신들이 지푸라기에 매달려 있음을 비웃는다.
그들의 지혜는 이렇게 말한다. "살아 남아 있는 자는 바보다. 그러나 우리는 그만큼 바보다! 그리고 이것이야말로 삶에서 가장 어리석은 일이다!"
"삶은 오직 고통일 뿐이다." 다른 자들은 이렇게 말하며 거짓말을 하지 않는다. 그렇다면 그대들이 끝장을 내도록 하라! 그대들이 오직 고통일 뿐인 그 삶을 끝장내도록 하라!

그리고 그대들의 덕의 가르침은 이렇게 말하게 하라. "너는 너 자신을 죽여야 한다! 너는 너 자신을 몰래 없애 버려야 한다!"
"음욕은 죄악이다." 죽음의 설교자 가운데 한 무리가 이렇게 말한다. "그러니 곁으로 비켜서서 아이를 낳지 말자!"

어딘가에 아직 민족들과 양 떼들이 남아 있지만, 형제들이여, 우리 곁에는 없다. 여기에는 국가들이 있다.
국가란 무엇인가? 자, 이제 귀를 기울여라! 이제 내가 그대들에게 민족들의 죽음에 대해 말할 것이니.

국가란 모든 차가운 괴물 가운데서도 가장 차가운 괴물의 이름이다. 국가는 차갑게 거짓말을 한다. 그리고 이런 거짓말이 그의 입에서 기어 나온다. "나, 국가가 바로 민족이다."
그것은 거짓말이다! 민족들을 창조하고 그들 위에 신앙과 사랑을 펼쳐 놓은 자들은 창조하는 자들이었다. 그렇게 그들은 삶에 봉사했던 것이다.
많은 사람들을 위해 올무를 놓고 그것을 국가라 부르는 자들은 파괴하는 자들이다. 그들은 많은 사람들 위에 칼 한 자루와 백 가지 욕망을 매달아 놓는다.

아직 민족이 존재하는 곳에서는 국가를 이해하지 못하며, 국가를 사악한 눈길이자 관습과 법에 대한 범죄로 증오한다.
내가 그대들에게 이 징표를 주노라. 모든 민족은 저마다 선과 악의 언어를 가지고 있으며, 이웃 민족은 그것을 이해하지 못한다. 모든 민족은 관습과 법에서 자기 자신의 언어를 발명해 냈다.
그러나 국가는 선과 악의 모든 언어 속에서 거짓말을 한다. 그리고 국가가 무엇을 말하든 거짓말을 하며, 무엇을 가지고 있든 그것은 훔친 것이다.
국가의 모든 것은 가짜다. 훔친 이빨로 물어뜯는 자, 이 물어뜯는 자는 뱃속까지도 가짜다.
선과 악의 언어의 혼란 — 내가 그대들에게 이 징표를 국가의 징표로 주노라. 진실로 이 징표는 죽음에 대한 의지를 가리킨다! 진실로 그것은 죽음의 설교자들에게 손짓한다!

너무나 많은 사람들이 태어난다. 불필요한 자들을 위해 국가가 발명되었다!
보라, 국가가 어떻게 그 너무나 많은 자들을 유인하는지를! 어떻게 그들을 삼키고 씹고 되새김질하는지를!
"지상에 나보다 더 위대한 것은 아무것도 없다. 나는 신의 질서 잡는 손가락이다." 그 괴물은 이렇게 포효한다. 그러자 긴 귀와 짧은 시력을 가진 자들뿐만 아니라 모든 자들이 무릎을 꿇는다!
아, 위대한 영혼들이여, 그 괴물은 그대들에게도 자신의 어두운 거짓말을 속삭인다! 아, 그는 스스로를 아낌없이 내어 주는 풍요로운 마음들을 알아채고 만다!
그렇다, 그는 낡은 신을 정복한 그대들마저 알아챈다! 그대들은 싸움에 지쳤고, 이제 그대들의 피로가 새로운 우상을 섬기고 있다!

그 새로운 우상은 자기 주위에 영웅들과 명예로운 자들을 세우고 싶어 한다! 그 차가운 괴물은 양심의 햇살 속에서 몸을 쬐기를 좋아한다!
그 새로운 우상은 그대들이 그를 숭배하기만 한다면 그대들에게 모든 것을 줄 것이다. 그렇게 그는 그대들의 덕의 광채와 그대들의 자랑스러운 눈빛을 사들인다.
그대는 그 괴물이 너무나 많은 사람들을 낚기 위한 미끼가 되어야 한다! 그렇다, 거기에는 지옥의 속임수가 발명되어 있다. 신성한 명예의 딸랑거리는 장식으로 치장한 죽음의 말이 발명되어 있다!
그렇다, 거기에는 많은 사람들을 위한 죽음이 발명되어 있으며, 그 죽음은 스스로를 삶이라 찬양한다. 진실로 그것은 죽음의 모든 설교자들에게 바치는 마음 깊은 봉사다!

너무나 많은 사람들이 살고, 너무나 오래 자기들의 가지에 매달려 있는 곳을 나는 국가라 부른다. 그 모든 불필요한 자들을 쓸어 버릴 폭풍이 불어오기를!
새로운 설교자들이 와서 빠른 죽음을 설교하기를! 그들이야말로 삶에 불어오는 진정한 폭풍이 될 것이다! 그러나 내가 듣는 것은 오직 '국가는 가장 중요한 것이다'라는 외침뿐이다.
그리고 그 외침이 상인들의 외침과 뒤섞이는 것을 보라!

불필요한 자들이 모두 죽는 곳, 그곳에서 불필요한 자들의 찬가가 시작된다. 믿겠는가?
불필요한 자들을 보라! 그들은 발명가들의 작품과 현자들의 보물을 훔친다. 그들은 자신들의 도둑질을 '교양'이라 부르며, 그들에게는 모든 것이 병과 재앙으로 변한다!
불필요한 자들을 보라! 그들은 언제나 병들어 있고, 쓸개즙을 토해 내며 그것을 '신문'이라 부른다. 그들은 서로를 삼키지만, 결코 소화시키지 못한다.
불필요한 자들을 보라! 그들은 부를 긁어모으지만, 그로 인해 더욱 가난해진다. 그들은 권력을 원하며, 무엇보다 먼저 권력의 지렛대인 많은 돈을 원한다 — 이 무능한 자들이여!

기어오르는 이 불필요한 자들을 보라! 그들은 서로 다른 원숭이들을 밟고 기어올라, 진흙과 심연 속으로 서로를 끌어내린다.
그들은 모두 왕좌를 향해 나아간다. 마치 행복이 왕좌 위에 앉아 있는 것처럼 생각하는 것이 그들의 광기다! 종종 진흙이 왕좌 위에 앉아 있고, 종종 왕좌 역시 진흙 위에 놓여 있다.
내게 그들은 모두 미친 자들이며, 기어오르는 원숭이들이고, 열병에 들뜬 자들이다. 그들의 우상, 그 차가운 괴물에게서 악취가 난다. 이 우상 숭배자들 모두에게서 악취가 난다.

형제들이여, 그대들은 그들의 주둥이와 욕망의 김 속에서 질식해 죽으려 하는가? 차라리 창문을 깨고 바깥으로 뛰어내려라!
악취를 피하라! 불필요한 자들의 우상 숭배를 피하라!
악취를 피하라! 이 인간 희생 제물의 연기를 피하라!
위대한 영혼들에게는 지금도 대지가 열려 있다. 외로운 자들과 둘이서 사는 은둔자들을 위해 아직도 많은 빈자리가 남아 있으며, 그 주위에는 고요한 바다의 향기가 불어온다.
위대한 영혼들에게는 아직도 자유로운 삶이 열려 있다. 진실로 적게 소유하는 자일수록 그만큼 덜 소유당한다. 작은 가난이여, 찬미받을지어다!

국가가 끝나는 곳, 비로소 그곳에서 불필요하지 않은 인간이 시작된다. 필요한 자의 노래가 시작되고, 단 한 번뿐이며 대체 불가능한 선율이 시작된다.
국가가 끝나는 곳 — 형제들이여, 저기를 보라! 그대들에게 무지개와 위버멘쉬로 향하는 다리들이 보이지 않는가?

차라투스트라는 이렇게 말했다.

제1부 · 12장. 시장의 파리떼에 대하여

나의 친구여, 너의 고독 속으로 도망쳐라! 나는 네가 위대한 자들의 소음에 귀가 먹먹해지고, 작은 자들의 침에 찔려 있는 것을 본다.
숲과 바위는 너와 함께 위엄 있게 침묵할 줄 안다. 네가 사랑하는 그 나무, 넓은 가지를 뻗은 그 나무와 다시 닮아라. 그 나무는 고요히 귀를 기울이며 바다 위로 몸을 기울이고 있다.

고독이 끝나는 곳, 그곳에서 시장이 시작된다. 그리고 시장이 시작되는 곳, 그곳에서 위대한 배우들의 소음과 독파리들의 윙윙거림도 시작된다.
세상에서 가장 훌륭한 것들도 그것을 연기해 주는 자가 없으면 아무런 가치가 없다. 민중은 그 배우들을 위대한 자들이라 부른다.
민중은 위대한 것, 즉 창조하는 것을 거의 이해하지 못한다. 그러나 그들은 위대한 것의 모든 배우들과 연기자를 알아보는 감각을 가지고 있다.

세계는 새로운 가치를 발명하는 자들을 중심으로 돌아간다. 보이지 않게 돌아간다. 그러나 민중과 명성은 배우들을 중심으로 돌아간다. 그것이 '세상 돌아가는 이치'다.
배우는 정신을 가지고 있지만, 정신에 대한 양심은 거의 없다. 배우는 언제나 사람들이 자기를 가장 잘 믿게 만드는 것 — 즉 자기 자신을 믿게 만드는 것을 믿는다!
내일이면 그는 새로운 신앙을 가질 것이고, 모레면 또 다른 새로운 신앙을 가질 것이다. 배우는 민중처럼 재빠른 감각을 가지고 있으며, 변덕스러운 날씨를 타고난다.

뒤집어엎는 것 — 배우는 그것을 '증명하는 것'이라 부른다. 미치게 만드는 것 — 배우는 그것을 '설득하는 것'이라 부른다. 그리고 피는 배우에게 모든 근거 가운데 가장 훌륭한 근거다.
오직 섬세한 귀에만 스며드는 진리를 배우는 거짓이자 허무라고 부른다. 진실로 배우는 세상에서 큰 소리를 낼 수 있는 신들만을 믿는다!

시장은 엄숙한 광대들로 가득 차 있고, 민중은 자신들의 위대한 인물들을 자랑한다! 그들은 민중에게 오늘의 주인들이다.
그러나 오늘이 그들을 압박한다. 그래서 그들은 너를 압박한다! 그리고 그들은 너에게서도 '예' 아니면 '아니오'라는 대답을 원한다. 아, 너는 찬성과 반대 사이에 의자를 놓으려 하는가?
무조건적인 자들이 너를 압박한다 해서 질투하지 마라, 진리를 사랑하는 자여! 진리는 결코 무조건적인 자의 팔짱을 낀 적이 없다.
이 갑작스러운 자들 때문에 너의 안전함 속으로 돌아가라. 오직 시장에서만 사람들은 '예? 아니면 아니오?'라는 질문으로 공격받는다.

모든 깊은 우물은 천천히 체험한다. 우물은 자기 깊이 속으로 무엇이 떨어졌는지 알기까지 오래 기다려야 한다.
위대한 모든 것은 시장과 명성으로부터 멀리 떨어져 일어난다. 새로운 가치의 발명가들은 언제나 시장과 명성으로부터 멀리 떨어져 살았다.

나의 친구여, 너의 고독 속으로 도망쳐라! 나는 네가 독파리들에게 쏘인 것을 본다. 너의 고독 속으로 도망쳐라. 거칠고 강한 바람이 부는 곳으로!
너의 고독 속으로 도망쳐라! 너는 작은 자들과 가련한 자들과 너무 가까이 살았다. 그들의 보이지 않는 복수를 피하라! 너를 향한 그들의 마음은 온통 복수심뿐이다.
더 이상 그들을 향해 팔을 들어 올리지 마라! 그들은 셀 수 없이 많으며, 파리채 노릇을 하는 것은 너의 운명이 아니다.

이 작은 자들과 가련한 자들은 셀 수 없이 많다. 그리고 많은 자랑스러운 건물들이 이미 빗방울과 잡초에 의해 무너졌다.
너는 돌이 아니지만, 이미 많은 빗방울들에 의해 속이 파여 버렸다. 너는 아직도 많은 빗방울들에 의해 부서지고 갈라질 것이다.
나는 네가 독파리들에게 지쳐 있는 것을 본다. 나는 네가 백 군데나 피를 흘리며 찢겨 있는 것을 본다. 그러나 너의 자존심은 화조차 내려 하지 않는다.
그들은 전혀 순수하지 않으면서도 너에게서 피를 원한다. 그들의 피 없는 영혼은 피를 갈망한다 — 그래서 그들은 전혀 순수하지 않은 채 너를 찌르는 것이다.
그러나 깊은 너는 작은 상처들로부터도 너무 깊이 고통받는다. 네가 상처에서 미처 회복되기도 전에 이미 같은 독벌레가 네 손 위를 기어다닌다.

나의 친구여, 나는 네가 그들을 때려죽이기에는 너무나 자긍심이 강하다는 것을 안다. 그러나 조심하라, 그들의 모든 독이 담긴 불의를 짊어지는 것이 너의 운명이 되지 않도록!
그들은 칭찬을 하면서도 네 주위를 윙윙거린다. 그들의 칭찬은 뻔뻔스러움이다. 그들은 너의 살갗과 피에 가까이 다가가려 한다.
그들은 신이나 악마에게 아첨하듯 네게 아첨한다. 그들은 신이나 악마 앞에서 울부짖듯 네 앞에서 울부짖는다. 무슨 상관이 있겠는가! 그들은 아첨꾼이자 울보일 뿐, 그 이상은 아무것도 아니다.
또한 그들은 종종 네게 다정한 척한다. 그러나 그것이 언제나 비겁한 자들의 영리함이었다. 그렇다, 비겁한 자들은 영리하다!

그들은 그들의 좁은 영혼으로 너에 대해 많은 생각을 한다 — 너는 언제나 그들에게 의심스러운 존재다! 사람들이 너무 많이 생각하는 대상은 모두 의심스러운 존재가 된다.
그들은 너의 모든 덕에 대해 너를 벌준다. 그들이 진심으로 너를 용서해 주는 것은 오직 — 너의 실수들뿐이다!
네가 온화하고 공정하기 때문에 너는 말한다. "그들의 작은 존재에는 죄가 없다." 그러나 그들의 좁은 영혼은 이렇게 생각한다. "모든 큰 존재는 그 자체로 죄악이다."
네가 그들에게 온화하게 대할 때조차, 그들은 네가 자신들을 경멸하고 있다고 느낀다. 그리고 그들은 숨겨진 악행으로 너의 선행에 보답한다.
말없는 너의 자긍심은 언제나 그들의 비위를 거스른다. 네가 어쩌다 한 번 허영심을 부릴 만큼 겸손해지면 그들은 기뻐한다.

우리가 한 인간에게서 알아보는 것, 우리는 그 사람 안에서 그것에 불을 붙이기도 한다. 그러므로 작은 자들을 조심하라!
너의 앞에서 그들은 스스로를 작게 느끼며, 그들의 비천함이 너를 향한 보이지 않는 복수심으로 타오르고 불타오른다.
네가 그들에게 다가갈 때마다 그들이 얼마나 자주 말문을 닫았는지, 그리고 불이 꺼진 곳에서 연기가 피어오르듯 그들에게서 힘이 빠져나가는 것을 너는 눈치채지 못했는가?

그렇다, 나의 친구여, 너는 너의 이웃들에게 나쁜 양심이다. 그들은 너를 감당할 자격이 없기 때문이다. 그래서 그들은 너를 미워하며 기꺼이 너의 피를 빨아먹으려 한다.
너의 이웃들은 언제나 독파리들일 것이다. 너의 위대함 그 자체가 그들을 더욱 독하게 만들고, 더욱 파리처럼 만들 것이다.

나의 친구여, 너의 고독 속으로 도망쳐라. 거칠고 강한 바람이 부는 곳으로! 파리채 노릇을 하는 것은 너의 운명이 아니다.

차라투스트라는 이렇게 말했다.

---PAGE---

제1부 · 13장. 순결에 대하여

나는 숲을 사랑한다. 도시에서는 살기가 나쁘다. 거기에는 음욕에 불타는 자들이 너무 많다.
음욕에 불타는 여인의 꿈속에 빠지는 것보다 살인자의 손에 빠지는 편이 낫지 않은가?
그리고 저 사내들을 보라. 그들의 눈이 말하고 있다 — 그들은 지상에서 여인과 함께 눕는 것보다 더 나은 것을 알지 못한다.
그들의 영혼 밑바닥에는 진흙이 깔려 있다. 그리고 그 진흙이 정신까지 가지게 된다면 화가 있을지어다!

차라리 그대들이 짐승처럼 완전하기라도 하다면! 그러나 짐승에게는 순수함이 있다.
내가 그대들에게 감각을 죽이라고 권하는가? 나는 그대들에게 감각의 순수함을 권한다.
내가 그대들에게 순결을 권하는가? 어떤 이들에게 순결은 덕이지만, 많은 이들에게는 거의 악덕에 가깝다.
이들은 절제하기는 하지만, 음욕이라는 암캐가 그들이 하는 모든 일 속에서 질투 어린 눈으로 엿보고 있다.
그들의 덕의 가장 높은 곳까지, 그리고 차가운 정신의 내부까지 이 짐승과 그 짐승의 불만족이 그들을 뒤따른다.
그리고 음욕이라는 암캐는 고깃조각을 거부당할 때면 한 조각의 정신이라도 구걸할 줄 얼마나 영리하게 아는가!

그대들은 비극과 마음을 찢는 모든 것을 사랑하는가? 그러나 나는 그대들의 암캐를 믿지 않는다.
그대들은 내게 너무나 잔인한 눈을 가지고 있으며, 고통받는 자들을 음탕한 눈길로 바라본다. 그대들의 음욕이 변장하고 스스로를 '동정'이라 부르는 것은 아닌가?

그리고 나는 그대들에게 이 비유도 주노라. 자신의 악마를 쫓아내려 했던 적지 않은 사람들이 그 과정에서 스스로 돼지 떼 속으로 들어가 버렸다.
순결이 어려운 자에게는 순결을 만류해야 한다. 그것이 지옥으로 가는 길 — 즉 영혼의 진흙과 음욕으로 가는 길이 되지 않도록 말이다.
내가 더러운 것들에 대해 말하고 있는가? 그것은 내게 가장 나쁜 일이 아니다.
인식하는 자는 진리의 물이 얕을 때가 아니라 더러울 때 그 물속에 들어가기를 꺼린다.

진실로 근본부터 순결한 자들이 있다. 그들은 그대들보다 마음이 더 온화하며, 그대들보다 더 기꺼이, 더 많이 웃는다.
그들은 순결마저도 비웃으며 묻는다. "순결이란 무엇인가? 순결은 어리석음이 아닌가? 그러나 이 어리석음이 우리에게 찾아왔지, 우리가 어리석음을 찾아간 것이 아니다.
우리는 이 손님에게 거처와 마음을 내어 주었다. 이제 그는 우리와 함께 살고 있다 — 그가 머물고 싶은 만큼 머물도록 두자!"

차라투스트라는 이렇게 말했다.

---PAGE---

제1부 · 14장. 친구에 대하여

"한 사람이라도 내 주위에 있으면 언제나 너무 많다." 은둔자는 이렇게 생각한다. "언제나 하나 곱하기 하나 — 그것은 결국 둘을 만들어 낸다!"
나와 나는 언제나 너무나 열렬히 대화를 나눈다. 친구가 없다면 어찌 견딜 수 있었겠는가?
은둔자에게 친구는 언제나 세 번째 사람이다. 세 번째 사람은 두 사람의 대화가 너무 깊은 곳으로 가라앉지 않도록 막아 주는 코르크 마개다.
아, 모든 은둔자에게는 너무나 많은 심연이 있다. 그래서 그들은 친구와 친구의 높이를 갈망한다.

다른 사람에 대한 우리의 믿음은 우리가 우리 자신에 대해 무엇을 믿고 싶어 하는지를 드러낸다. 친구에 대한 우리의 갈망은 우리의 배반자다.
그리고 종종 사람들은 사랑을 통해 그저 질투를 뛰어넘으려 할 뿐이다. 또한 종종 사람들은 자기 자신을 방어하기 위해 공격하고 적을 만든다.
"적어도 나의 적이 되어 다오!" — 감히 우정을 청하지 못하는 진정한 존경심은 이렇게 말한다.

친구를 가지고 싶다면, 그를 위해 전쟁을 치를 각오도 되어 있어야 한다. 그리고 전쟁을 치르려면, 적이 될 줄도 알아야 한다.
친구 안에서도 여전히 적을 존경해야 한다. 너는 너의 친구에게 맞서지 않고서 그에게 가까이 다가갈 수 있는가?
친구 안에서 가장 좋은 적을 가져야 한다. 네가 그에게 맞설 때 너의 마음은 그에게 가장 가까이 있어야 한다.

너는 너의 친구 앞에서 아무것도 걸치지 않으려 하는가? 네가 있는 그대로의 모습을 보여 주는 것이 너의 친구에게 영예가 될 것인가? 그러나 바로 그 때문에 친구는 너를 악마에게 보내 버린다!
자기 자신을 감추지 않는 자는 분노를 불러일으킨다. 그대들이 벌거벗음을 두려워해야 할 이유는 차고 넘친다! 그렇다, 그대들이 신이라면 그대들은 옷을 부끄러워해도 좋으리라!
너의 친구를 위해서는 아무리 아름답게 꾸며도 지나치지 않다. 너는 그에게 위버멘쉬를 향한 화살이자 동경이 되어야 하기 때문이다.

너는 네 친구가 잠든 모습을 본 적이 있는가 — 그가 어떻게 생겼는지 알기 위해서? 그런데 원래 네 친구의 얼굴은 무엇인가? 그것은 거칠고 불완전한 거울에 비친 너 자신의 얼굴이다.
너는 네 친구가 잠든 모습을 본 적이 있는가? 네 친구의 모습을 보고 놀라지 않았는가? 오, 나의 친구여, 인간은 극복되어야 할 그 무엇이다.

추측하는 자이자 침묵하는 자 — 친구는 이 둘에 능숙해야 한다. 너는 모든 것을 다 보려고 해서는 안 된다. 네 친구가 깨어 있을 때 무엇을 하는지는 꿈속에서 이미 드러나야 한다.
너의 동정심은 추측이 되어야 한다. 네 친구가 동정심을 원하는지 아닌지를 먼저 알기 위해서 말이다. 어쩌면 그는 너에게서 꺾이지 않는 눈과 영원의 눈길을 사랑할지도 모른다.
친구에 대한 동정심은 단단한 껍질 속에 숨겨 두어라. 네가 그 껍질 위에서 이빨을 하나 부러뜨릴 정도로 말이다. 그래야만 그 동정심은 섬세함과 달콤함을 지니게 될 것이다.

너는 네 친구에게 맑은 공기이자 고독이며 빵이자 약인가? 어떤 사람은 자기 자신의 사슬을 풀지 못하면서도 친구에게는 구원자가 된다.
너는 노예인가? 그렇다면 너는 친구가 될 수 없다. 너는 폭군인가? 그렇다면 너는 친구를 가질 수 없다.

여인 안에는 너무 오랫동안 노예와 폭군이 숨어 있었다. 그렇기 때문에 여인은 아직 우정을 맺을 능력이 없다. 여인은 오직 사랑만을 알 뿐이다.
여인의 사랑 속에는 사랑하지 않는 모든 것에 대한 불의와 맹목이 들어 있다. 그리고 여인의 의식적인 사랑 속에서도 여전히 빛과 나란히 기습과 번개와 밤이 존재한다.
여인은 아직 우정을 맺을 능력이 없다. 여인은 여전히 고양이이자 새다. 기껏해야 암소일 뿐이다.
여인은 아직 우정을 맺을 능력이 없다. 그러나 사내들이여, 내게 말해 보라. 그대들 가운데 우정을 맺을 능력이 있는 자가 누구인가?

오, 사내들이여, 그대들의 가난함과 영혼의 인색함이여! 그대들이 친구에게 주는 만큼, 나는 나의 적에게도 줄 것이다. 그리고 나는 그로 인해 가난해지지 않을 것이다.
전우애가 있다. 우정이 있기를!

차라투스트라는 이렇게 말했다.

---PAGE---

제1부 · 15장. 천 개의 목표와 하나의 목표에 대하여

차라투스트라는 많은 나라와 많은 민족들을 보았다. 그렇게 그는 많은 민족들의 선과 악을 발견했다. 차라투스트라는 지상에서 이웃 민족의 선과 악보다 더 큰 힘을 발견하지 못했다.

어느 민족이든 먼저 평가를 내리지 않고서는 살아남을 수 없었다. 그러나 스스로를 보존하려 한다면, 이웃 민족이 평가하는 것처럼 평가해서는 안 된다.
한 민족에게 선하다고 불렸던 많은 것들이 다른 민족에게는 조롱과 수치심이었다. 나는 그렇게 발견했다. 여기서 악하다고 불렸던 많은 것들이 저기서는 자주빛 명예로 치장되어 있는 것을 나는 발견했다.
한 이웃은 결코 다른 이웃을 이해하지 못했다. 언제나 그의 영혼은 이웃의 망상과 악의에 놀라워했다.

모든 민족 위에는 선의 석판이 걸려 있다. 보라, 그것은 그 민족이 극복해 낸 것들의 석판이다. 보라, 그것은 그들의 힘에의 의지의 목소리다.
그들에게 어렵게 여겨지는 것은 칭찬할 만한 것이다. 불가피하고 어려운 것은 선하다고 불린다. 그리고 가장 깊은 곤경에서조차 해방시켜 주는 것, 가장 드물고 가장 어려운 것 — 그것을 그들은 거룩하다고 찬양한다.

그들이 지배하고 승리하고 빛나게 만드는 것, 이웃에게 공포와 부러움을 불러일으키는 것 — 그것이 그들에게는 높은 것이며, 첫 번째 것이고, 척도이자 모든 사물의 의미로 여겨진다.
진실로 나의 형제여, 네가 어떤 민족의 곤경과 땅과 하늘과 이웃을 먼저 알아낸다면, 너는 그들의 극복의 법칙과 어째서 그들이 바로 이 사다리를 타고 자신들의 희망을 향해 오르는지를 추측해 낼 수 있을 것이다.

"너는 언제나 첫 번째가 되어야 하며, 다른 사람들을 앞질러야 한다. 너의 질투하는 영혼은 친구 외에는 아무도 사랑해서는 안 된다." — 이 말이 그리스인의 영혼을 전율하게 했다. 그리하여 그는 자신의 위대함의 길을 걸었다.
"진실을 말하고 활과 화살을 잘 다루는 것" — 차라투스트라의 이름이 유래한 그 민족에게는 이것이 사랑스럽고도 어려운 일로 여겨졌다. 그 이름 자체가 내게는 사랑스럽고도 어려운 이름이다.
"아버지와 어머니를 공경하고, 영혼의 가장 깊은 곳까지 그들의 뜻에 따르는 것" — 또 다른 민족은 자신들 위에 이 극복의 석판을 걸어 놓고, 그로 인해 강하고 영원해졌다.
"신의를 지키고, 신의를 위해서는 명예와 피마저도 악하고 위험한 일에 내어 주는 것" — 이렇게 스스로를 가르치며 또 다른 민족은 자신을 극복했고, 그렇게 자신을 극복하면서 큰 희망을 잉태하고 무거워졌다.

진실로 인간들은 스스로에게 모든 선과 악을 부여했다. 진실로 그들은 그것을 어디서 취한 것도, 발견한 것도 아니며, 하늘에서 목소리처럼 떨어진 것도 아니다.
인간은 자신을 보존하기 위해 비로소 사물들 안에 의미를 불어넣었다 — 인간이 비로소 사물들의 의미를 창조했던 것이다! 그렇기 때문에 그는 스스로를 '인간', 즉 '평가하는 자'라 부른다.

평가하는 것이 곧 창조하는 것이다. 들어라, 창조하는 자들이여! 평가하는 것 자체가 평가된 모든 것들의 보물이자 보석이다.
평가를 통해서 비로소 가치가 존재한다. 평가가 없다면 존재의 호두 속은 텅 비어 있을 것이다. 들어라, 창조하는 자들이여!

가치의 변화 — 그것은 창조하는 자들의 변화다. 창조자가 되어야 하는 자는 언제나 파괴한다.
처음에는 민족들이 창조자였고, 나중에서야 비로소 개인들이 창조자가 되었다. 진실로 개인 그 자체가 가장 최근의 창조물이다.
한때 민족들은 자신들 위에 선의 석판을 걸어 놓았다. 지배하려는 사랑과 복종하려는 사랑이 함께 그들을 위해 그런 석판을 창조했던 것이다.
무리 속에서 느끼는 기쁨은 '나' 안에서 느끼는 기쁨보다 더 오래되었다. 그리고 선한 양심이 '무리'라고 불리는 한, 오직 나쁜 양심만이 '나'라고 말한다.

너는 새로운 힘이며 새로운 권리인가? 최초의 움직임인가? 스스로 돌아가는 바퀴인가? 너는 별들마저 강제하여 네 주위를 돌게 만들 수 있는가?
아, 높은 곳을 향한 욕망이 얼마나 많은가! 야망에 불타는 자들의 경련이 얼마나 많은가! 네가 그 욕망에 불타는 자들과 야망에 찬 자들 가운데 한 사람이 아님을 내게 보여 주어라!
아, 위대한 사상들이 얼마나 많은가! 그러나 그것들은 풀무 이상의 역할을 하지 못한다. 부풀어 오르게 하지만 오히려 더 텅 비게 만들 뿐이다.

너는 스스로를 자유롭다고 부르는가? 나는 너의 지배적인 사상을 듣고 싶지, 네가 어떤 멍에에서 벗어났는지를 듣고 싶지 않다.
너는 어떤 멍에에서 벗어날 자격이 있는 자인가? 자신의 복종을 내던지면서 자신의 마지막 가치마저 내던져 버린 자들이 적지 않다.
무엇으로부터의 자유인가? 그것이 차라투스트라에게 무슨 상관이 있겠는가! 그러나 너의 맑은 눈이 내게 알려 주어야 한다. 무엇을 위한 자유인가를!

너는 네 자신에게 너의 선과 너의 악을 부여하고, 너의 의지를 너의 위에 법처럼 세울 수 있는가? 너는 네 자신의 재판관이 되고, 네 자신의 법의 집행자가 될 수 있는가?
자기 자신의 법의 재판관이자 집행자로서 홀로 남는 것은 무서운 일이다. 그렇게 별들은 허공 속으로, 고독의 얼어붙은 숨결 속으로 내던져진다.

오늘 너는 아직 많은 사람들로 인해 고통받고 있다, 한 사람인 너여! 오늘 너는 아직 너의 용기와 너의 희망을 온전히 지니고 있다.
그러나 언젠가 고독이 너를 지치게 할 것이고, 언젠가 너의 자긍심이 구부러지고 너의 용기가 이빨을 갈 것이다. 언젠가 너는 외칠 것이다. "나는 혼자다!"
언젠가 너는 너의 높은 모습을 더 이상 보지 못하고, 너의 낮은 모습만을 너무 가까이 보게 될 것이다. 너의 숭고함 그 자체가 유령처럼 너에게 공포를 줄 것이다. 언젠가 너는 외칠 것이다. "모든 것이 거짓이다!"

고독한 자를 죽이려 하는 감정들이 있다. 그 감정들이 죽이지 못하면, 그 감정들 스스로가 죽어야만 한다! 그러나 너는 살인자가 될 수 있는가?
나의 형제여, 너는 이미 '경멸'이라는 단어를 아는가? 그리고 너를 경멸하는 자들에게조차 공정해야 한다는 너의 정의의 고통을 아는가?
너는 많은 사람들에게 너에 대한 생각을 다시 배우도록 강요한다. 그들은 그 일을 결코 너에게 용서하지 않을 것이다.
너는 그들에게 가까이 다가갔지만 그들을 지나쳐 가 버렸다. 그들은 결코 그것을 용서하지 않을 것이다.
너는 그들을 넘어선다. 그러나 네가 높이 오르면 오를수록, 질투의 눈에는 네가 그만큼 더 작게 보인다. 그리고 날아오르는 자가 가장 미움을 받는다.

"어째서 그대들이 내게 공정할 수 있겠는가!" — 너는 이렇게 말해야 한다. "나는 나에게 몫으로 돌아온 그대들의 불의를 선택한다."
그들은 고독한 자에게 불의와 오물을 던진다. 그러나 나의 형제여, 네가 별이 되고자 한다면, 그들을 비추는 일을 그만두어서는 안 된다!

그리고 선한 자들과 의로운 자들을 조심하라! 그들은 스스로에게 덕을 발명해 내는 자들을 기꺼이 십자가에 못 박는다 — 그들은 고독한 자를 미워한다.
또한 거룩한 단순함도 조심하라! 단순하지 않은 것은 모두 그들에게 불경스러운 것이다. 그들은 또한 불을 가지고 놀기를 좋아한다 — 화형장의 불을 말이다.
그리고 너 자신의 사랑의 발작도 조심하라! 고독한 자는 자기가 만나는 사람에게 너무 빨리 손을 내민다.
어떤 사람들에게는 손을 내밀어서는 안 되고, 오직 앞발만을 내밀어야 한다. 그리고 나는 너의 앞발에 발톱이 있기를 바란다.

그러나 네가 만날 수 있는 가장 위험한 적은 언제나 너 자신일 것이다. 너는 동굴과 숲속에서 너 자신을 기다리며 숨어 있다.
고독한 자여, 너는 너 자신에게로 가는 길을 가고 있다! 그리고 너의 길은 너 자신과 너의 일곱 악마를 지나간다!
너는 네 자신에게 이단자가 될 것이며, 마녀가 되고, 점쟁이가 되고, 바보가 되고, 의심하는 자가 되고, 불경스러운 자가 되고, 악당이 될 것이다.
너는 네 자신의 불꽃 속에서 스스로를 태워 버릴 각오가 되어 있어야 한다. 네가 먼저 재가 되지 않고서 어떻게 새로워질 수 있겠는가!

고독한 자여, 너는 창조하는 자의 길을 가고 있다. 너는 너의 일곱 악마로부터 너를 위한 신을 창조하려 한다!
고독한 자여, 너는 사랑하는 자의 길을 가고 있다. 너는 너 자신을 사랑하며, 오직 사랑하는 자만이 경멸할 줄 알듯이 너 자신을 경멸한다!
사랑하는 자는 경멸하기 때문에 창조하려 한다! 사랑하는 대상을 경멸해 본 적이 없는 자가 사랑에 대해 무엇을 알겠는가!

나의 형제여, 너의 사랑과 너의 창조를 가지고 너의 고독 속으로 들어가라. 그러면 나중에야 정의가 절뚝거리며 너를 뒤따라올 것이다.
나의 눈물을 가지고 너의 고독 속으로 들어가라, 나의 형제여. 나는 자기 자신을 넘어서는 무언가를 창조하려 하고, 그리하여 몰락하는 자를 사랑한다.

차라투스트라는 이렇게 말했다.

제1부 · 18장. 늙은 여인과 젊은 여인에 대하여

"차라투스트라여, 어째서 저녁 어스름 속을 그렇게 조심스레 몰래 걸어가십니까? 그리고 외투 속에 그렇게 소중히 감추고 계신 것은 무엇입니까?
누군가 당신에게 선물로 준 보물입니까? 아니면 당신에게 태어난 아이입니까? 아니면 착한 자들의 친구여, 당신도 이제 도둑의 길을 걷고 계신 겁니까?"

진실로 나의 형제여, 차라투스트라가 대답했다. 그것은 누군가 내게 선물로 준 보물이다. 그것은 내가 품고 있는 작은 진리다.
그러나 이 진리는 어린아이처럼 다루기 어렵다. 내가 이 진리의 입을 막아 주지 않으면, 이 진리는 너무나 큰 소리로 울부짖는다.

오늘 해가 질 무렵 내가 혼자서 내 길을 걷고 있을 때, 한 늙은 여인을 만났고 그녀가 내 영혼에게 이렇게 말했다.
"차라투스트라는 우리 여인들에게도 많은 말씀을 하셨습니다. 그러나 아직 여인에 대해서는 한 번도 말씀하지 않으셨군요."
내가 그녀에게 대답했다. "여인에 대해서는 오직 사내들에게만 말해야 합니다."
"저에게도 여인에 대해 말씀해 주십시오." 그녀가 말했다. "저는 그 말을 곧 잊어버릴 만큼 나이를 충분히 먹었으니까요."

그래서 나는 그 늙은 여인의 청을 들어주어 이렇게 말했다.

여인에 관한 모든 것은 수수께끼이며, 여인에 관한 모든 것에는 하나의 해답이 있다. 그것은 임신이다.
사내는 여인에게 수단이다. 목적은 언제나 아이다. 그러나 사내에게 여인은 무엇인가?
진정한 사내는 두 가지를 원한다. 위험과 놀이. 그렇기 때문에 그는 가장 위험한 장난감인 여인을 원한다.
사내는 전쟁을 위해 교육되어야 하고, 여인은 전사의 휴식을 위해 교육되어야 한다. 그 밖의 모든 것은 어리석음이다.

전사는 너무 달콤한 열매를 좋아하지 않는다. 그렇기 때문에 그는 여인을 좋아한다. 가장 달콤한 여인조차도 여전히 씁쓸하기 때문이다.
여인은 사내보다 어린아이를 더 잘 이해한다. 그러나 사내는 여인보다 더 어린아이답다.
진정한 사내 안에는 어린아이가 숨어 있다. 그 어린아이는 놀고 싶어 한다. 자, 여인들이여, 사내 안의 그 어린아이를 발견해 내어라!

여인은 하나의 장난감이 되게 하라. 순수하고 섬세하며, 아직 존재하지 않는 세계의 덕들로 빛나는 보석처럼 말이다.
그대들의 사랑 속에서 별빛이 빛나게 하라! 그대들의 희망은 이것이 되게 하라. "내가 위버멘쉬를 낳기를!"
그대들의 사랑 속에 용기가 깃들게 하라! 그대들의 사랑으로 그대들에게 두려움을 주는 자에게 맞서 나아가라.
그대들의 사랑 속에 그대들의 명예가 있게 하라! 그 밖에 여인은 명예에 대해 거의 이해하지 못한다. 그러나 그대들의 명예는 언제나 사랑받는 것보다 더 많이 사랑하는 것이 되게 하라. 결코 두 번째가 되지 마라!

사내는 사랑하는 여인을 두려워해야 한다. 여인이 사랑할 때 그녀는 모든 것을 희생하며, 그 밖의 모든 것은 그녀에게 아무런 가치가 없기 때문이다.
사내는 미워하는 여인을 두려워해야 한다. 사내는 영혼의 밑바닥에서 단지 악할 뿐이지만, 여인은 그곳에서 비열하기 때문이다.
여인이 가장 미워하는 자는 누구인가? 쇠가 자석에게 말했듯이 말이다. "나는 너를 가장 미워한다. 네가 나를 끌어당기지만, 나를 완전히 끌어당길 만큼 강하지는 못하기 때문이다!"

사내의 행복은 "나는 원한다"이다. 여인의 행복은 "그가 원한다"이다.
"보라, 지금 세계가 완전해졌다!" 사랑에 온전히 복종할 때 모든 여인은 이렇게 생각한다.
그리고 여인은 복종해야 하며, 자신의 깊이를 위한 표면을 찾아야 한다. 여인의 영혼은 표면이며, 얕은 물 위에서 움직이는 출렁이는 얇은 막이다.
그러나 사내의 영혼은 깊다. 그의 강물은 지하의 동굴 속에서 포효한다. 여인은 그의 힘을 예감하지만, 이해하지는 못한다.

그러자 늙은 여인이 내게 대답했다. "차라투스트라는 많은 고운 말씀을 하셨습니다. 특히 그런 말들을 들을 만큼 젊은 여인들에게는 더욱 그렇습니다.
이상한 일이지요. 차라투스트라는 여인들을 거의 알지 못하면서도, 여인들에 대해 옳은 말씀을 하시는군요! 그것은 여인에게 불가능한 일이 아무것도 없기 때문일까요?
그리고 이제 감사의 표시로 작은 진리 하나를 받으십시오! 저는 그 진리를 말할 만큼 나이를 충분히 먹었습니다.
그 진리를 잘 감싸서 입을 막아 주십시오. 그렇지 않으면 그 작은 진리가 너무나 큰 소리로 울부짖을 테니까요."

"여인이여, 그대의 작은 진리를 내게 주십시오!" 내가 말했다. 그러자 늙은 여인은 이렇게 말했다.
"여인들에게 가는가? 채찍을 잊지 마시오!"

차라투스트라는 이렇게 말했다.

제1부 · 19장. 독사의 물림에 대하여

어느 날 차라투스트라는 무화과나무 아래서 잠이 들었는데, 날씨가 더웠기 때문에 두 팔로 얼굴을 가리고 있었다. 그때 한 마리의 독사가 기어와 그의 목을 물었고, 차라투스트라는 고통에 비명을 질렀다. 그가 얼굴에서 팔을 내리고 독사를 바라보자, 독사는 차라투스트라의 눈을 알아보았다. 그러자 독사는 어색하게 몸을 비틀며 도망치려 했다.
"아직 가지 마라!" 차라투스트라가 말했다. "너는 아직 내게서 감사의 인사를 받지 않았다! 너는 나를 제때에 깨워 주었다. 내 길은 아직 멀었기 때문이다."
"당신의 길은 이제 짧습니다." 독사가 슬프게 말했다. "제 독은 치명적입니다."
차라투스트라는 미소를 지었다. "언제 용이 독사의 독으로 죽은 적이 있던가?" 그가 말했다. "그러나 네 독을 다시 거두어 가라! 너는 내게 그것을 선물할 만큼 부유하지 못하다."
그러자 독사는 다시 그의 목을 휘감고 그의 상처를 핥았다.

어느 날 차라투스트라가 제자들에게 이 이야기를 들려주었을 때, 제자들이 물었다. "차라투스트라여, 이 이야기의 교훈이 무엇입니까?" 차라투스트라는 이렇게 대답했다.

선한 자들과 의로운 자들은 나를 도덕의 파괴자라고 부른다. 나의 이야기는 비도덕적이다.
그러나 그대들에게 적이 있다면, 그에게 악을 선으로 갚지 마라. 그것은 그를 부끄럽게 만들 것이기 때문이다. 차라리 그가 그대들에게 무언가 좋은 일을 해 주었다는 것을 증명해 보여라!
부끄러움을 주는 것보다는 차라리 화를 내라! 그리고 그대들이 저주를 받는다면, 그대들이 축복을 내리는 것은 내 마음에 들지 않는다. 차라리 함께 조금 저주하라!
그리고 그대들에게 큰 불의가 행해졌다면, 재빨리 다섯 개의 작은 불의를 거기에 덧붙여라! 불의만을 혼자 짊어지고 있는 자의 모습은 보기에 끔찍하다.
그대들은 이미 이 사실을 알고 있었는가? 나누어진 불의는 절반의 정의다. 그리고 불의를 견딜 수 있는 자가 그 불의를 짊어져야 한다!

작은 복수가 복수를 전혀 하지 않는 것보다 더 인간적이다. 그리고 형벌이 범죄자에게 권리이자 명예가 되지 못한다면, 나는 그대들의 형벌조차 원하지 않는다.
자신이 옳다고 주장하는 것보다 스스로 잘못했다고 인정하는 것이 더 고귀하다. 특히 자신이 옳을 때에는 더욱 그렇다. 다만 그러기 위해서는 그만큼 부유해야 한다.

나는 그대들의 차가운 정의를 좋아하지 않는다. 그대들의 재판관들의 눈에서는 언제나 사형 집행인과 그의 차가운 칼날만이 엿보인다.
말해 보라, 눈을 뜬 사랑인 정의는 어디에 있는가?
그러니 모든 형벌뿐만 아니라 모든 죄책감마저 무죄로 만들어 주는 사랑을 내게 발명해 주어라!
그러니 모든 사람을 무죄로 만들어 주는 정의를 내게 발명해 주어라 — 다만 심판하는 자만을 제외하고!

그리고 이 말도 함께 들어라. 근본부터 인식하는 자에게는 모든 감정과 감각이 고귀해진다.
그의 영혼은 기뻐하며 노래한다. "붉은 것 모두가 아름답다! 그리고 고슴도치마저 아름답다!"

차라투스트라는 이렇게 말했다.

---PAGE---

제1부 · 20장. 아이와 결혼에 대하여

나의 형제여, 내게 너만을 위한 질문이 하나 있다. 나는 이 질문을 너의 영혼 속으로 추처럼 던진다. 그 깊이가 얼마나 되는지 알기 위해서다.
너는 젊으며, 아이와 결혼을 원한다. 그러나 나는 네게 묻는다. 너는 아이를 원할 자격이 있는 사람인가?
너는 승리자인가, 자기 자신을 극복한 자인가, 감각의 지배자인가, 너의 덕의 주인인가? 나는 네게 이렇게 묻는다.
아니면 너의 소원 속에서는 짐승과 욕구가 말하고 있는 것인가? 아니면 고독이 말하고 있는 것인가? 아니면 너 자신과의 불화가 말하고 있는 것인가?

나는 너의 승리와 너의 자유가 아이를 갈망하기를 바란다. 너는 너의 승리와 해방을 위해 살아 있는 기념비를 세워야 한다.
너는 너 자신을 넘어서 지어야 한다. 그러나 먼저 너 자신이 육체와 영혼 모두 직각을 이루도록 반듯하게 지어져야 한다.
너는 번식하는 것만이 아니라 더 높이 심어야 한다! 그러기 위해 결혼의 정원이 너를 돕기를!
너는 더 높은 육체를 창조해야 한다. 최초의 움직임, 스스로 돌아가는 바퀴를 창조해야 한다 — 창조하는 자를 창조해야 한다.

결혼 — 나는 두 사람이 그 두 사람을 넘어서는 하나의 존재를 창조하려는 의지를 결혼이라 부른다. 그런 의지를 지닌 자들 사이의 서로에 대한 경외심을 나는 결혼이라 부른다.
이것이 너의 결혼의 의미이자 진리가 되게 하라. 그러나 너무나 많은 불필요한 자들이 '결혼'이라 부르는 것 — 아, 그것을 내가 무엇이라 부를 것인가!
아, 둘이서 겪는 그 영혼의 가난함이여! 아, 둘이서 겪는 그 영혼의 더러움이여! 아, 둘이서 겪는 그 가련한 안일함이여!

그들은 이 모든 것을 결혼이라 부르며, 그들의 결혼은 하늘에서 맺어졌다고 말한다.
글쎄, 나는 불필요한 자들의 그 하늘이 마음에 들지 않는다! 글쎄, 그 천상의 그물에 걸린 짐승들이 내 마음에 들지 않는다!
절뚝거리며 다가와 자신이 묶어 놓지 않은 것을 축복하려는 그 신 또한 내게서 멀리 떨어져 있기를!

그런 결혼들을 비웃지 마라! 어떤 아이가 자기 부모 때문에 울어야 할 이유가 없겠는가?
내게 이 사내는 훌륭해 보였고, 대지의 의미를 위해 무르익어 보였다. 그러나 내가 그의 아내를 보았을 때, 내게 대지는 미친 자들의 집처럼 보였다.
그렇다, 나는 성자와 거위가 짝을 이룰 때 대지가 경련을 일으키며 떨기를 바란다.
이 사내는 영웅처럼 진리를 찾아 나섰고, 마침내 작은 거짓말 하나를 전리품으로 얻었다. 그는 그것을 자신의 결혼이라 부른다.
저 사내는 사람들과 어울릴 때 차갑고 까다롭게 선택했다. 그러나 그는 단 한 번에 영원히 자기의 사교 모임을 망쳐 놓았다. 그는 그것을 자신의 결혼이라 부른다.
또 다른 사내는 천사의 덕을 지닌 시녀를 찾았다. 그러나 단숨에 그는 한 여인의 시녀가 되어 버렸고, 이제 그 자신이 천사가 되어야 할 판이다.

나는 이제 모든 구매자들이 조심스러워졌고, 모두 교활한 눈을 가진 것을 본다. 그러나 가장 교활한 자조차도 자기 아내만큼은 자루 속에 든 채로 산다.
많은 짧은 어리석음들 — 그대들은 그것을 사랑이라 부른다. 그리고 그대들의 결혼은 하나의 긴 어리석음으로서 그 많은 짧은 어리석음들에 끝장을 낸다.
여인에 대한 그대들의 사랑과 사내에 대한 여인의 사랑 — 아, 그것이 고통받고 가려진 신들에 대한 동정심이라도 된다면 얼마나 좋을까! 그러나 거의 언제나 두 마리의 짐승이 서로를 알아볼 뿐이다.

그러나 그대들의 가장 좋은 사랑조차도 단지 황홀한 비유이며 고통스러운 열정일 뿐이다. 그것은 그대들을 넘어선 더 높은 길들을 비추어 주어야 하는 횃불이다.
언젠가 그대들은 그대들 자신을 넘어서 사랑해야 한다! 그러니 먼저 사랑하는 법을 배워라! 그리고 그를 위해 그대들은 사랑의 쓴 잔을 마셔야만 했다.
가장 좋은 사랑의 잔 속에도 씁쓸함이 들어 있다. 그것이 위버멘쉬에 대한 동경을 불러일으키며, 창조하는 자인 너에게 목마름을 불러일으킨다!
창조하는 자에게 목마름을, 화살을, 그리고 위버멘쉬에 대한 동경을 불러일으킨다. 나의 형제여, 말해 보라. 이것이 결혼을 향한 너의 의지인가?
그런 의지와 그런 결혼을 나는 거룩하다고 부른다.

차라투스트라는 이렇게 말했다.

---PAGE---

제1부 · 21장. 자유로운 죽음에 대하여

많은 사람들이 너무 늦게 죽고, 어떤 사람들은 너무 일찍 죽는다. 아직도 이 가르침은 낯설게 들린다. "제때에 죽어라!"
제때에 죽어라. 차라투스트라는 이렇게 가르친다.
물론 결코 제때에 살지 못한 자가 어떻게 제때에 죽을 수 있겠는가! 차라리 그가 결코 태어나지 않았더라면 좋았을 것이다! — 나는 불필요한 자들에게 이렇게 권한다.
그러나 불필요한 자들조차도 자신의 죽음을 중요하게 여기며, 가장 텅 빈 호두마저도 깨뜨려지기를 원한다.

모두가 죽음을 중요하게 여긴다. 그러나 아직 죽음은 축제가 아니다. 인간들은 아직 가장 아름다운 축제들을 성화하는 법을 배우지 못했다.
나는 그대들에게 완성시키는 죽음을 보여 주노라. 그것은 살아 있는 자들에게 가시이자 약속이 된다.
완성하는 자는 자신의 죽음을 죽는다. 희망하고 맹세하는 자들에게 둘러싸여 승리자로서 죽는다.
이렇게 죽는 법을 배워야 한다. 그리고 죽어 가는 자가 모든 사람의 맹세를 거룩하게 만들지 않는 곳에는 어떤 축제도 열려서는 안 된다!

이렇게 죽는 것이 가장 좋다. 그러나 두 번째로 좋은 것은 싸움 속에서 죽으며 위대한 영혼을 아낌없이 쏟아붓는 것이다.
그러나 싸우는 자에게나 승리자에게나 똑같이 미움을 받는 것은 그대들의 그 씩 웃는 죽음이다. 그것은 도둑처럼 슬금슬금 기어오면서도 주인 행세를 한다.

나는 그대들에게 나의 죽음을 찬양하노라. 내가 원하기 때문에 내게 찾아오는 자유로운 죽음을.
그런데 언제 내가 원하게 될 것인가? — 목표와 상속자를 가진 자는 목표와 상속자를 위해 제때에 죽기를 원한다.
그리고 목표와 상속자에 대한 경외심 때문에, 그는 더 이상 삶의 신전 안에 시든 화환을 걸어 두지 않을 것이다.

나는 밧줄을 꼬는 자들과 같아지고 싶지 않다. 그들은 실을 길게 뽑아내면서 스스로는 계속 뒷걸음질을 친다.
어떤 사람은 자신의 진리와 승리조차 감당하기에는 너무 늙어 버린다. 이빨 빠진 입에는 더 이상 모든 진리에 대한 권리가 없다.
그리고 명성을 원하는 모든 자는 제때에 명예와 작별하고, 제때에 떠나는 어려운 기술을 익혀야 한다.

자기 자신이 가장 맛있을 때 더 이상 먹히지 않도록 조심해야 한다. 오랫동안 사랑받기를 원하는 자들은 이 사실을 잘 안다.
물론 시큼한 사과들도 있다. 그들의 운명은 가을의 마지막 날까지 기다리는 것이다. 그들은 동시에 익어 가며 노랗게 변하고 주름이 잡힌다.
어떤 사람들은 먼저 마음이 늙고, 다른 사람들은 먼저 정신이 늙는다. 그리고 어떤 사람들은 젊었을 때부터 늙어 있다. 그러나 늦게 젊어지는 자는 오래 젊음을 유지한다.

어떤 사람들에게는 삶이 실패로 돌아간다. 독벌레 한 마리가 그들의 마음을 갉아먹는다. 그러니 그들은 자신의 죽음이 그만큼 더 성공적이도록 힘써야 한다!
어떤 사람들은 결코 달콤해지지 못하고, 이미 여름에 썩어 버린다. 비겁함이 그들을 가지에 매달아 두는 것이다.
너무나 많은 사람들이 살고, 너무나 오래 자기들의 가지에 매달려 있다. 폭풍이 불어와 이 썩고 벌레 먹은 것들을 모두 나무에서 떨어뜨려 버리기를!
빠른 죽음을 설교하는 설교자들이 오기를! 그들이야말로 삶의 나무를 흔드는 진정한 폭풍이 될 것이다! 그러나 내가 듣는 것은 오직 느린 죽음과 모든 '지상의 것'에 대한 인내를 설교하는 소리뿐이다.
아, 그대들은 지상의 것에 대한 인내를 설교하는가? 그러나 이 지상의 것들이 그대들을 너무 오래 인내해 왔다, 그대들 모독자들이여!

진실로 나사렛 예수는 너무 일찍 죽었다. 그 히브리인이 내 나이만큼만 더 살았더라면 그는 자신의 가르침을 철회했을 것이다! 그는 그럴 만큼 고귀했으니까!
그러나 그는 아직 미성숙했다. 젊은이는 미성숙하게 사랑하며, 또한 인간과 대지를 미성숙하게 미워한다. 그에게는 아직 마음과 정신의 날개가 묶여 있고 무거웠다.
그러나 어른 안에는 젊은이보다 더 많은 어린아이가 들어 있고, 우울함은 더 적다. 그는 죽음과 삶에 대해 더 잘 이해한다.

죽음에 대해 자유롭고 죽음 속에서 자유로운 자, 더 이상 '예'라고 말할 때가 아닐 때 거룩한 '아니오'라고 말하는 자 — 이렇게 그는 죽음과 삶에 대해 이해한다.
그대들의 죽음이 인간과 대지에 대한 모독이 되지 않도록 하라, 나의 친구들이여! 이것이 내가 그대들의 영혼의 꿀에 비는 가장 간절한 부탁이다.
그대들이 죽을 때에도 그대들의 정신과 덕은 여전히 저녁노을처럼 대지 주위에서 불타올라야 한다. 그렇지 않으면 그대들의 죽음은 실패한 것이다.

이렇게 나 자신도 죽고 싶다. 그리하여 친구들이 나를 위해 대지를 더욱 사랑하게 되도록. 그리고 나를 낳아 준 대지 속에서 안식을 얻기 위해, 나는 다시 대지가 되고 싶다.
진실로 차라투스트라는 하나의 목표를 가지고 있었고, 자신의 공을 던졌다. 이제 친구들이여, 그대들이 내 목표의 상속자가 되어라. 나는 그대들에게 황금 공을 던진다.
모든 것 가운데 내가 가장 사랑하는 것은 바로 그대들이 황금 공을 던지는 모습을 보는 것이다, 나의 친구들이여! 그러니 나는 조금 더 지상에 머물러 있겠다. 그 점을 용서해 다오!

차라투스트라는 이렇게 말했다.

---PAGE---

제1부 · 22장. 베푸는 덕에 대하여

1.
차라투스트라는 자기가 사랑하던 '얼룩소'라는 도시와 작별을 고했을 때, 스스로를 그의 제자라 부르며 그를 따라나선 많은 사람들이 그와 함께 걸었다. 그들은 함께 걸어가다 한 네거리에 이르렀다. 그때 차라투스트라가 그들에게 이제 혼자 가고 싶다고 말하자, 그들은 제자들이 스승에게 작별을 고하는 방식을 이해했다. 그리고 제자들은 그에게 지팡이 하나를 선물로 건넸는데, 그 황금 손잡이에는 태양을 휘감고 있는 뱀 한 마리가 새겨져 있었다. 차라투스트라는 그 지팡이를 기뻐하며 몸을 기댔다. 그리고 제자들에게 이렇게 말했다.

"내게 말해 보라. 어째서 황금이 가장 높은 가치를 지니게 되었는가? 그것은 황금이 드물고 쓸모가 없으며, 빛나고 그 광채가 온화하기 때문이다. 황금은 언제나 자기 자신을 선물로 내어 준다.
오직 가장 높은 덕의 비유로서만 황금은 가장 높은 가치를 지니게 되었다. 베푸는 자의 시선은 황금처럼 빛난다. 황금의 광채는 달과 태양 사이에 화해를 맺어 준다.
가장 높은 덕은 드물고 쓸모가 없으며, 빛나고 그 광채가 온화하다. 베푸는 덕이 바로 가장 높은 덕이다.

진실로 나는 그대들을 꿰뚫어 본다, 나의 제자들이여! 그대들은 나처럼 베푸는 덕을 갈망하고 있다. 그대들이 고양이와 늑대와 무슨 상관이 있겠는가?
그대들 자신이 제물이 되고 선물이 되는 것, 이것이 그대들의 목마름이다. 그렇기 때문에 그대들은 그대들의 영혼 속에 모든 보물을 쌓아 두려는 목마름을 가지고 있다.
그대들의 영혼은 보물과 보석들을 만족할 줄 모르고 갈망한다. 그대들의 덕이 선물하려는 의지에서 만족할 줄 모르기 때문이다.
그대들은 모든 사물을 그대들에게로, 그리고 그대들 안으로 강제하여 끌어당긴다. 그 모든 사물이 그대들의 우물에서 그대들의 사랑의 선물로서 다시 흘러넘치도록 하기 위해서다.
진실로 그런 베푸는 사랑은 모든 가치의 도둑이 되어야 한다. 그러나 나는 그런 이기심을 거룩하고 건강하다고 부른다.

또 다른 이기심이 있다. 너무나 가난하고 굶주린 이기심, 언제나 훔치려고만 하는 이기심, 병든 자들의 이기심, 병든 이기심이다.
그 이기심은 도둑의 눈으로 모든 빛나는 것을 바라본다. 그것은 굶주림의 눈으로 먹을 것이 풍부한 자를 잰다. 그리고 언제나 베푸는 자들의 식탁 주위를 살금살금 배회한다.
그런 탐욕 속에서는 병이 말하고 있으며, 보이지 않는 퇴화가 말하고 있다. 이 병든 이기심의 도둑질하는 탐욕은 병든 육체로부터 나오는 것이다.

나의 형제들이여, 내게 말해 보라. 우리에게 나쁜 것, 가장 나쁜 것은 무엇인가? 그것은 퇴화가 아닌가? — 그리고 베푸는 영혼이 부족한 곳에서 우리는 언제나 퇴화를 추측한다.
우리의 길은 위로 향한다. 종(種)에서 위버멘쉬(초인)를 향하여. 그러나 우리는 '모든 것은 나를 위해!'라고 말하는 퇴화된 감각을 공포스럽게 여긴다.
우리의 감각은 위로 날아오른다. 그렇게 우리의 감각은 우리 육체의 비유이며, 고양의 비유다. 그러한 고양의 비유들이 곧 덕들의 이름이다.
그렇게 육체는 역사를 통과하며 생성되는 자이자 투쟁하는 자로 걸어간다. 그리고 정신 — 육체에게 정신이란 무엇인가? 육체의 투쟁과 승리의 전령이며, 동반자이자 메아리다.

선과 악의 모든 이름은 비유다. 그것들은 말로 다 표현하지 못하고 단지 암시할 뿐이다. 그것들로부터 지식을 얻으려는 자는 어리석은 자다!
나의 형제들이여, 그대들의 정신이 비유로 말하려 할 때 그 시간을 주의 깊게 살펴라. 거기에 그대들의 덕의 기원이 있다.
그때 그대들의 육체는 고양되고 부활한다. 육체는 자신의 황홀함으로 정신을 매혹하여, 정신이 창조하는 자이자 평가하는 자이자 사랑하는 자, 그리고 모든 사물의 은인이 되도록 만든다.
그대들의 마음이 강물처럼 넓고 충만하게 솟구쳐 오를 때, 이웃들에게 축복이자 위험이 될 때 — 거기에 그대들의 덕의 기원이 있다.
그대들이 칭찬과 비난을 초월할 때, 그리고 그대들의 의지가 사랑하는 자의 의지로서 모든 사물에 명령하려 할 때 — 거기에 그대들의 덕의 기원이 있다.
그대들이 안일함과 부드러운 잠자리를 경멸하고, 부드러운 자들로부터 멀리 떨어져도 결코 충분히 멀리 떨어지지 않았다고 느낄 때 — 거기에 그대들의 덕의 기원이 있다.
그대들이 단 하나의 의지의 의욕자들이 될 때, 그리고 모든 필연의 전환점이 그대들에게 '필연'이라 불릴 때 — 거기에 그대들의 덕의 기원이 있다.
진실로 그것이 새로운 선과 악이다! 진실로 그것은 깊은 곳에서 솟아오르는 새로운 웅성거림이며, 새로운 샘의 목소리다!

그것은 힘이다, 이 새로운 덕은. 그것은 지배적인 사상이며, 그 주위에는 영리한 영혼이 둘러싸고 있다. 황금빛 태양, 그리고 그 주위를 도는 인식의 뱀이다."

2.
여기서 차라투스트라는 잠시 침묵하며 사랑스러운 눈길로 제자들을 바라보았다. 그런 다음 그는 다시 말을 이었다 — 그의 목소리는 달라져 있었다.

"나의 형제들이여, 그대들의 덕의 힘으로 대지에 충실하라! 그대들의 베푸는 사랑과 그대들의 인식이 대지의 의미에 봉사하게 하라! 나는 그대들에게 이렇게 간청하고 맹세하게 하노라.
그 사랑과 인식이 지상의 것으로부터 날아가 버려, 부러진 날개로 영원한 벽을 들이받지 않도록 하라! 아, 지금까지 언제나 너무나 많은 덕이 길을 잃고 날아가 버렸다!
나처럼 길을 잃은 덕을 다시 대지로 데려오라 — 그렇다, 육체와 삶으로 되돌려 놓아라. 그리하여 그 덕이 대지에게 대지의 의미를, 인간의 의미를 부여하도록 하라!

지금까지 정신과 덕은 백 가지 방식으로 날아가 버렸고 길을 잃었다. 아, 우리 육체 속에는 아직도 그 모든 망상과 착오가 깃들어 있다. 그것들은 육체이자 의지가 되었다.
지금까지 정신과 덕은 백 가지 방식으로 시도하고 길을 잃었다. 그렇다, 인간은 하나의 시도였다. 아, 너무나 많은 무지와 오류가 우리 안에서 육체가 되었다!
수천 년의 이성뿐만 아니라, 수천 년의 광기 역시 우리 안에서 터져 나온다. 상속자가 된다는 것은 위험한 일이다.
우리는 아직도 우연이라는 거인과 한 걸음씩 싸우고 있으며, 지금까지 온 인류 위에는 무의미, 즉 의미 없음이 지배해 왔다.

나의 형제들이여, 그대들의 정신과 그대들의 덕이 대지의 의미에 봉사하게 하라. 그리고 모든 사물의 가치가 그대들에 의해 새롭게 정립되게 하라! 그러므로 그대들은 투쟁하는 자가 되어야 한다! 그러므로 그대들은 창조하는 자가 되어야 한다!
인식함으로써 육체는 스스로를 정화한다. 인식을 시도함으로써 육체는 스스로를 고양시킨다. 인식하는 자에게는 모든 충동이 거룩해진다. 고양된 자의 영혼은 명랑해진다.

의사여, 너 자신을 고쳐라. 그러면 너는 너의 환자도 고칠 것이다. 그가 눈으로 자기 자신을 고치는 자를 보는 것이 그에게 가장 좋은 치료가 되게 하라.

아직 세워지지 않은 천 개의 오솔길이 있다. 천 개의 건강과 숨겨진 삶의 섬들이 있다. 인간과 인간의 대지는 아직 다 파헤쳐지지 않았고 발견되지도 않았다.
깨어 있고 귀를 기울여라, 고독한 자들이여! 미래로부터 은밀한 날갯짓을 하는 바람이 불어오고 있으며, 섬세한 귀에는 기쁜 소식이 들려온다.

오늘의 고독한 자들이여, 스스로 떨어져 나온 자들이여, 언젠가 그대들은 하나의 민족이 될 것이다. 스스로를 선택한 그대들로부터 선택받은 민족이 자라날 것이며 — 그 민족으로부터 위버멘쉬가 자라날 것이다.
진실로 대지는 회복의 장소가 될 것이다! 그리고 이미 새로운 향기가 대지를 감싸고 있다. 구원을 가져다주는 향기이자, 새로운 희망이다!"

3.
차라투스트라는 이 말을 마친 뒤, 아직 마지막 말을 다 하지 못한 사람처럼 침묵했다. 그는 오랫동안 망설이며 손에 든 지팡이를 저울질했다. 마침내 그는 이렇게 말했다 — 그의 목소리는 달라져 있었다.

"이제 나는 혼자 간다, 나의 제자들이여! 그대들도 이제 가라, 그리고 혼자 가라! 나는 그것을 원한다.
진실로 나는 그대들에게 권하노니, 내게서 떠나 차라투스트라에 맞서 자신을 지켜라! 그리고 더 좋은 것은 그를 부끄러워하는 것이다! 어쩌면 그가 그대들을 속였을지도 모르니까.
인식하는 자는 자신의 적을 사랑할 수 있을 뿐만 아니라, 자신의 친구를 미워할 수도 있어야 한다.
언제나 제자로만 남아 있는 사람은 스승에게 나쁘게 보답하는 것이다. 어째서 그대들은 나의 월계관을 뜯어내려 하지 않는가?
그대들은 나를 존경한다. 그러나 언젠가 그대들의 존경심이 무너진다면 어찌할 것인가? 동상이 쓰러져 그대들을 깔아뭉개지 않도록 조심하라!
그대들은 차라투스트라를 믿는다고 말하는가? 그러나 차라투스트라가 무엇이 중요하단 말인가! 그대들은 나의 신자들이다. 그러나 모든 신자들이 무엇이 중요하단 말인가!
그대들은 아직 그대들 자신을 찾지 못했다. 그때 그대들이 나를 발견했던 것이다. 모든 신자들이 그러하다. 그렇기 때문에 모든 신앙은 그토록 가치가 없는 것이다.

이제 나는 그대들에게 명하노니, 나를 잃어버리고 그대들 자신을 발견하라! 그리고 그대들 모두가 나를 부인했을 때, 비로소 나는 그대들에게 돌아올 것이다.

진실로 나의 형제들이여, 그때 나는 다른 눈으로 나의 잃어버린 자들을 찾을 것이다. 그때 나는 다른 사랑으로 그대들을 사랑할 것이다.
그리고 언젠가 그대들은 다시 나의 친구들이 되고, 하나의 희망의 아이들이 될 것이다. 그때 나는 그대들과 함께 위대한 정오를 축하하기 위해 세 번째로 그대들 곁에 머무를 것이다.
그리고 위대한 정오란, 인간이 짐승과 위버멘쉬 사이의 길 한가운데 서서 저녁으로 향하는 자신의 길을 가장 높은 희망으로 축하하는 시간이다. 그것은 새로운 아침으로 가는 길이기 때문이다.
그때 몰락하는 자는 자신이 건너가는 자임을 스스로 축복할 것이며, 그의 인식의 태양은 정오에 서 있을 것이다.

'모든 신들은 죽었다. 이제 우리는 위버멘쉬가 살기를 원한다.' — 이것이 언젠가 위대한 정오에 우리의 마지막 의지가 되게 하라!"

차라투스트라는 이렇게 말했다.`,

니체가 말한 '창조하는 자의 길'도 마찬가지입니다. 누군가 정해놓은 정답을 그대로 따라 하는 것이 아니라, 비록 조금 서툴고 외롭더라도 내 두 발로 나만의 길을 걸어가는 용기 말입니다.

let currentEp = 'ep1';
let currentTab = 'raw';
let currentPage = 0;
let autoPages = [];
let isEditing = false;
let timerInterval = null;
let seconds = 0;
let fontSize = window.innerWidth <= 960 ? 17 : 20;

function isTwoPageMode() {
  return window.innerWidth > 960 && !isEditing;
}

function getStorageKey() {
  return `zarathustra_wide_${currentEp}_${currentTab}`;
}

function getFullText() {
  const saved = localStorage.getItem(getStorageKey());
  const raw = saved ? saved : episodesData[currentEp].scripts[currentTab];
  return raw.replace(/\n---PAGE---\n/g, '\n\n');
}

function paginateText(fullText) {
  const box = document.getElementById('leftPage');
  const style = window.getComputedStyle(box);
  const padTop = parseFloat(style.paddingTop) || 20;
  const padBot = parseFloat(style.paddingBottom) || 20;
  const padLeft = parseFloat(style.paddingLeft) || 20;
  const padRight = parseFloat(style.paddingRight) || 20;

  const availHeight = box.clientHeight - padTop - padBot - 6;
  const availWidth = box.clientWidth - padLeft - padRight;

  if (availHeight <= 40 || availWidth <= 40) {
    return [fullText];
  }

  const measurer = document.createElement('div');
  measurer.style.position = 'fixed';
  measurer.style.visibility = 'hidden';
  measurer.style.pointerEvents = 'none';
  measurer.style.left = '-9999px';
  measurer.style.top = '0';
  measurer.style.width = availWidth + 'px';
  measurer.style.fontFamily = style.fontFamily;
  measurer.style.fontSize = fontSize + 'px';
  measurer.style.lineHeight = style.lineHeight;
  measurer.style.whiteSpace = 'pre-wrap';
  measurer.style.wordBreak = 'keep-all';
  measurer.style.overflowWrap = 'break-word';
  document.body.appendChild(measurer);

  const paragraphs = fullText.split('\n');
  const resultPages = [];
  let currentChunk = [];

  for (let i = 0; i < paragraphs.length; i++) {
    const p = paragraphs[i];
    const testLines = currentChunk.concat(p);
    measurer.innerText = testLines.join('\n');

    if (measurer.offsetHeight <= availHeight) {
      currentChunk.push(p);
    } else {
      if (currentChunk.length > 0) {
        resultPages.push(currentChunk.join('\n').trim());
        currentChunk = [];
      }
      measurer.innerText = p;
      if (measurer.offsetHeight <= availHeight) {
        currentChunk.push(p);
      } else {
        const words = p.split(' ');
        let subLine = '';
        for (let w = 0; w < words.length; w++) {
          const candidate = subLine ? subLine + ' ' + words[w] : words[w];
          measurer.innerText = candidate;
          if (measurer.offsetHeight <= availHeight) {
            subLine = candidate;
          } else {
            if (subLine) resultPages.push(subLine.trim());
            subLine = words[w];
          }
        }
        if (subLine) currentChunk.push(subLine);
      }
    }
  }

  if (currentChunk.length > 0) {
    const last = currentChunk.join('\n').trim();
    if (last) resultPages.push(last);
  }

  document.body.removeChild(measurer);
  return resultPages.length > 0 ? resultPages : [fullText];
}

function renderContent(keepRatio = false) {
  const ep = episodesData[currentEp];
  document.getElementById('trackTitle').innerText = ep.meta[currentTab].title;
  document.getElementById('readTime').innerText = ep.meta[currentTab].time;

  const spread = document.getElementById('bookSpread');
  const leftBox = document.getElementById('leftPage');
  const rightBox = document.getElementById('rightPage');

  leftBox.style.fontSize = fontSize + 'px';
  rightBox.style.fontSize = fontSize + 'px';

  const fullText = getFullText();

  if (isEditing) {
    spread.classList.add('single-col');
    rightBox.style.display = 'none';
    leftBox.innerText = fullText;
    document.getElementById('pageIndicator').innerText = '편집 중';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }

  const twoPage = isTwoPageMode();
  if (twoPage) {
    spread.classList.remove('single-col');
    rightBox.style.display = 'block';
  } else {
    spread.classList.add('single-col');
    rightBox.style.display = 'none';
  }

  const prevRatio = autoPages.length > 1 ? currentPage / (autoPages.length - 1) : 0;
  autoPages = paginateText(fullText);

  if (keepRatio && autoPages.length > 1) {
    currentPage = Math.round(prevRatio * (autoPages.length - 1));
  }

  if (twoPage) {
    if (currentPage % 2 !== 0) currentPage--;
    if (currentPage >= autoPages.length) currentPage = Math.max(0, autoPages.length - 2);
    if (currentPage < 0) currentPage = 0;

    leftBox.innerText = autoPages[currentPage] || '';
    rightBox.innerText = autoPages[currentPage + 1] || '';

    const endPage = Math.min(currentPage + 2, autoPages.length);
    document.getElementById('pageIndicator').innerText = `${currentPage + 1}-${endPage} / ${autoPages.length}`;
    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage + 2 >= autoPages.length;
  } else {
    if (currentPage >= autoPages.length) currentPage = autoPages.length - 1;
    if (currentPage < 0) currentPage = 0;

    leftBox.innerText = autoPages[currentPage] || '';
    document.getElementById('pageIndicator').innerText = `${currentPage + 1} / ${autoPages.length}`;
    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage >= autoPages.length - 1;
  }
}

function switchEpisode(epKey) {
  if (isEditing) toggleEdit();
  currentEp = epKey;
  currentPage = 0;
  renderContent(false);
}

function switchTab(tab, btn) {
  if (isEditing) toggleEdit();
  currentTab = tab;
  currentPage = 0;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderContent(false);
}

function changePage(dir) {
  if (isEditing) return;
  const step = isTwoPageMode() ? 2 : 1;
  const next = currentPage + dir * step;
  if (next >= 0 && next < autoPages.length) {
    currentPage = next;
    renderContent(false);
  }
}

function toggleEdit() {
  const leftBox = document.getElementById('leftPage');
  const btn = document.getElementById('editBtn');
  isEditing = !isEditing;
  leftBox.contentEditable = isEditing;

  if (isEditing) {
    btn.innerText = '✅ 수정 완료';
    renderContent(false);
    leftBox.focus();
  } else {
    localStorage.setItem(getStorageKey(), leftBox.innerText.trim());
    btn.innerText = '✏️ 직접 수정';
    currentPage = 0;
    renderContent(false);
  }
}

function resetScript() {
  if (confirm('현재 선택한 회차/탭의 수정 내용을 초기 원고로 되돌릴까요?')) {
    localStorage.removeItem(getStorageKey());
    currentPage = 0;
    renderContent(false);
  }
}

function downloadTxt() {
  const text = getFullText();
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `차라투스트라_${currentEp}_${currentTab}.txt`;
  a.click();
}

function toggleTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  } else {
    timerInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    }, 1000);
  }
}

function resetTimer() {
  seconds = 0;
  document.getElementById('timerDisplay').innerText = '00:00';
}

function changeFont(delta) {
  fontSize = Math.max(14, Math.min(32, fontSize + delta));
  renderContent(true);
}

function setTheme(theme) {
  document.body.classList.remove('dark', 'prompter');
  if (theme) document.body.classList.add(theme);
}

function toggleFocus() {
  document.body.classList.toggle('focus-mode');
  setTimeout(() => renderContent(true), 50);
}

document.addEventListener('keydown', (e) => {
  if (isEditing || document.activeElement.tagName === 'SELECT') return;
  if (e.code === 'ArrowRight' || e.code === 'Space') {
    e.preventDefault();
    changePage(1);
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    changePage(-1);
  }
});

let touchStartX = 0;
let touchStartY = 0;
document.getElementById('bookSpread').addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

document.getElementById('bookSpread').addEventListener('touchend', (e) => {
  if (isEditing) return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) changePage(1);
    else changePage(-1);
  }
}, { passive: true });

window.addEventListener('resize', () => {
  if (!isEditing) renderContent(true);
});

window.addEventListener('load', () => renderContent(false));
renderContent(false);
</script>
